async function callOpenAI(baseUrl, apiKey, model, messages, onChunk, signal = null) {
  const url = `${baseUrl}/v1/chat/completions`;
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${apiKey}`
  };
  const body = {
    model,
    messages,
    stream: true
  };

  const useSignal = signal || (currentAbortController = new AbortController()).signal;

  const state = {
    thinking: '',
    content: '',
    phase: 'content',
    thinkingStartTime: null,
    firstContentTokenTime: null,
    thinkingDuration: null
  };

  const startTime = Date.now();

  // 原始内容（含标签）和thinking解析状态
  let rawContent = '';  // 保存原始完整内容
  let inThinking = false;
  let thinkingBuffer = '';  // 用于提取thinking内容
  let currentThinkingTag = null;  // 当前匹配的标签类型

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: useSignal
    });

    if (!res.ok) {
      const error = await res.text();
      throw new Error(`API错误: ${res.status} - ${error}`);
    }

    if (!res.body) {
      throw new Error('Response body is empty');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let streamBuffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      streamBuffer += decoder.decode(value, { stream: true });
      const lines = streamBuffer.split('\n');
      streamBuffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;

          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta;

            // DeepSeek格式：reasoning_content是独立字段
            if (delta?.reasoning_content) {
              if (!state.thinkingStartTime) {
                state.thinkingStartTime = Date.now();
                state.phase = 'thinking';
              }
              state.thinking += delta.reasoning_content;
              onChunk(state);
            }

            // 普通content字段
            const chunk = delta?.content;
            if (chunk) {
              // DeepSeek格式：收到content时（reasoning_content结束后），计算thinkingDuration
              if (state.thinkingStartTime && state.thinkingDuration === null && state.phase === 'thinking') {
                state.thinkingDuration = Date.now() - state.thinkingStartTime;
                state.phase = 'content';
              }

              // 保存原始内容（含标签，用于调试）
              rawContent += chunk;

              // 解析thinking标签（多标签支持）
              thinkingBuffer += chunk;

              if (!inThinking) {
                for (const tag of THINKING_TAGS) {
                  const startIdx = thinkingBuffer.indexOf(tag.start);
                  if (startIdx !== -1) {
                    inThinking = true;
                    currentThinkingTag = tag;
                    state.thinkingStartTime = Date.now();
                    state.phase = 'thinking';
                    // 标签前的内容归入content
                    if (startIdx > 0) {
                      state.content += thinkingBuffer.slice(0, startIdx);
                    }
                    thinkingBuffer = thinkingBuffer.slice(startIdx + tag.start.length);
                    break;
                  }
                }
              }

              if (inThinking && currentThinkingTag) {
                const endIdx = thinkingBuffer.indexOf(currentThinkingTag.end);
                if (endIdx !== -1) {
                  // thinking内容不含标签
                  state.thinking += thinkingBuffer.slice(0, endIdx);
                  thinkingBuffer = thinkingBuffer.slice(endIdx + currentThinkingTag.end.length);
                  inThinking = false;
                  currentThinkingTag = null;
                  state.phase = 'content';

                  if (state.firstContentTokenTime === null) {
                    state.firstContentTokenTime = Date.now();
                  }
                  // thinking结束，计算thinkingDuration（thinking结束时间 - 开始时间）
                  if (state.thinkingStartTime) {
                    state.thinkingDuration = Date.now() - state.thinkingStartTime;
                  }
                } else {
                  // 还在thinking阶段，继续累积（不含标签）
                  state.thinking += thinkingBuffer;
                  thinkingBuffer = '';
                }
              } else if (!inThinking) {
                // 非thinking阶段的内容归入content
                state.content += thinkingBuffer;
                thinkingBuffer = '';
              }

              // firstContentTokenTime：第一个chunk的时间
              if (state.firstContentTokenTime === null && rawContent.length > 0) {
                state.firstContentTokenTime = Date.now();
              }

              onChunk(state);
            }
          } catch (e) {}
        }
      }
    }

    // 处理未结束的thinking
    if (inThinking && thinkingBuffer) {
      state.thinking += thinkingBuffer;
    }

    if (state.thinkingStartTime && state.thinkingDuration === null) {
      state.thinkingDuration = Date.now() - state.thinkingStartTime;
    }

    return state;
  } catch (e) {
    if (e.name === 'AbortError') {
      return state;
    }
    throw e;
  } finally {
    if (!signal) {
      currentAbortController = null;
    }
  }
}

async function callClaude(baseUrl, apiKey, model, messages, onChunk, signal = null) {
  const url = `${baseUrl}/v1/messages`;
  const headers = {
    'Content-Type': 'application/json',
    'x-api-key': apiKey,
    'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true'
  };

  const claudeMessages = messages.map(m => ({
    role: m.role,
    content: m.content
  }));

  const body = {
    model,
    max_tokens: 4096,
    messages: claudeMessages,
    stream: true
  };

  const useSignal = signal || (currentAbortController = new AbortController()).signal;

  const state = {
    thinking: '',
    content: '',
    phase: 'content',
    thinkingStartTime: null,
    firstContentTokenTime: null,
    thinkingDuration: null
  };

  const startTime = Date.now();

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: useSignal
    });

    if (!res.ok) {
      const error = await res.text();
      throw new Error(`API错误: ${res.status} - ${error}`);
    }

    if (!res.body) {
      throw new Error('Response body is empty');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);

          try {
            const json = JSON.parse(data);

            if (json.type === 'content_block_start' && json.content_block?.type === 'thinking') {
              state.phase = 'thinking';
              state.thinkingStartTime = Date.now();
            }
            else if (json.type === 'content_block_delta' && json.delta?.type === 'thinking_delta') {
              state.thinking += json.delta.thinking || '';
              state.phase = 'thinking';
              // 实时计算thinkingDuration
              if (state.thinkingStartTime && state.thinkingDuration === null) {
                state.thinkingDuration = Date.now() - state.thinkingStartTime;
              }
              onChunk(state);
            }
            else if (json.type === 'content_block_delta' && json.delta?.type === 'text_delta') {
              if (state.firstContentTokenTime === null) {
                state.firstContentTokenTime = Date.now();
                if (state.thinkingStartTime) {
                  state.thinkingDuration = state.firstContentTokenTime - state.thinkingStartTime;
                }
              }
              state.content += json.delta.text || '';
              state.phase = 'content';
              onChunk(state);
            }
            else if (json.type === 'content_block_start' && json.content_block?.type === 'text') {
              state.phase = 'content';
              if (state.firstContentTokenTime === null) {
                state.firstContentTokenTime = Date.now();
              }
            }
          } catch (e) {}
        }
      }
    }

    if (state.thinkingStartTime && state.thinkingDuration === null) {
      state.thinkingDuration = Date.now() - state.thinkingStartTime;
    }

    return state;
  } catch (e) {
    if (e.name === 'AbortError') {
      return state;
    }
    throw e;
  } finally {
    if (!signal) {
      currentAbortController = null;
    }
  }
}

async function callGemini(baseUrl, apiKey, model, messages, onChunk, signal = null) {
  const url = `${baseUrl}/v1beta/models/${model}:streamGenerateContent?key=${apiKey}&alt=sse`;

  const contents = [];
  let currentRole = null;
  let currentParts = [];

  for (const msg of messages) {
    const role = msg.role === 'user' ? 'user' : 'model';
    if (currentRole !== role) {
      if (currentRole !== null) {
        contents.push({ role: currentRole, parts: currentParts });
      }
      currentRole = role;
      currentParts = [];
    }
    currentParts.push({ text: msg.content });
  }
  if (currentRole !== null) {
    contents.push({ role: currentRole, parts: currentParts });
  }

  const body = { contents };

  const useSignal = signal || (currentAbortController = new AbortController()).signal;

  const state = {
    thinking: '',
    content: '',
    phase: 'content',
    thinkingStartTime: null,
    firstContentTokenTime: null,
    thinkingDuration: null
  };

  // 原始内容（含标签）和thinking解析状态
  let rawContent = '';
  let inThinking = false;
  let thinkingBuffer = '';
  let currentThinkingTag = null;

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: useSignal
    });

    if (!res.ok) {
      const error = await res.text();
      throw new Error(`API错误: ${res.status} - ${error}`);
    }

    if (!res.body) {
      throw new Error('Response body is empty');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let streamBuffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      streamBuffer += decoder.decode(value, { stream: true });
      const lines = streamBuffer.split('\n');
      streamBuffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);

          try {
            const json = JSON.parse(data);
            const chunk = json.candidates?.[0]?.content?.parts?.[0]?.text;
            if (chunk) {
              // 保存原始内容（含标签，用于调试）
              rawContent += chunk;

              // 解析thinking标签（多标签支持）
              thinkingBuffer += chunk;

              if (!inThinking) {
                for (const tag of THINKING_TAGS) {
                  const startIdx = thinkingBuffer.indexOf(tag.start);
                  if (startIdx !== -1) {
                    inThinking = true;
                    currentThinkingTag = tag;
                    state.thinkingStartTime = Date.now();
                    state.phase = 'thinking';
                    // 标签前的内容归入content
                    if (startIdx > 0) {
                      state.content += thinkingBuffer.slice(0, startIdx);
                    }
                    thinkingBuffer = thinkingBuffer.slice(startIdx + tag.start.length);
                    break;
                  }
                }
              }

              if (inThinking && currentThinkingTag) {
                const endIdx = thinkingBuffer.indexOf(currentThinkingTag.end);
                if (endIdx !== -1) {
                  state.thinking += thinkingBuffer.slice(0, endIdx);
                  thinkingBuffer = thinkingBuffer.slice(endIdx + currentThinkingTag.end.length);
                  inThinking = false;
                  currentThinkingTag = null;
                  state.phase = 'content';

                  if (state.firstContentTokenTime === null) {
                    state.firstContentTokenTime = Date.now();
                  }
                  // thinking结束，计算thinkingDuration（thinking结束时间 - 开始时间）
                  if (state.thinkingStartTime) {
                    state.thinkingDuration = Date.now() - state.thinkingStartTime;
                  }
                } else {
                  state.thinking += thinkingBuffer;
                  thinkingBuffer = '';
                }
              } else if (!inThinking) {
                // 非thinking阶段的内容归入content
                state.content += thinkingBuffer;
                thinkingBuffer = '';
              }

              if (state.firstContentTokenTime === null && rawContent.length > 0) {
                state.firstContentTokenTime = Date.now();
              }

              onChunk(state);
            }
          } catch (e) {}
        }
      }
    }

    if (inThinking && thinkingBuffer) {
      state.thinking += thinkingBuffer;
    }

    if (state.thinkingStartTime && state.thinkingDuration === null) {
      state.thinkingDuration = Date.now() - state.thinkingStartTime;
    }

    return state;
  } catch (e) {
    if (e.name === 'AbortError') {
      return state;
    }
    throw e;
  } finally {
    if (!signal) {
      currentAbortController = null;
    }
  }
}

async function callAPI(style, baseUrl, apiKey, model, messages, onChunk, signal = null) {
  switch (style) {
    case 'openai':
      return await callOpenAI(baseUrl, apiKey, model, messages, onChunk, signal);
    case 'claude':
      return await callClaude(baseUrl, apiKey, model, messages, onChunk, signal);
    case 'gemini':
      return await callGemini(baseUrl, apiKey, model, messages, onChunk, signal);
    default:
      throw new Error(`不支持的接口风格: ${style}`);
  }
}

// 并行调用所有模型
async function callAllModels(groups, modelIds, messages, onChunk) {
  const startTime = Date.now();
  activeGenerations.clear();

  // 初始化每个模型的状态和AbortController
  modelIds.forEach(id => {
    activeGenerations.set(id, {
      abortController: new AbortController(),
      status: 'generating',
      firstTokenTime: null,
      startTime,
      content: '',
      thinking: '',
      thinkingDuration: null
    });
  });

  // 并行调用所有模型
  const promises = modelIds.map(async id => {
    const info = findModelById(groups, id);
    const state = activeGenerations.get(id);

    if (!info) {
      state.status = 'failed';
      state.error = '模型不存在';
      return { modelId: id, status: 'failed', error: '模型不存在', content: '', timestamp: Date.now() };
    }

    try {
      const resultState = await callAPI(
        info.group.style,
        info.group.baseUrl,
        info.group.key,
        info.model.name,
        messages,
        chunkState => {
          const genState = activeGenerations.get(id);
          if (genState) {
            genState.content = chunkState.content;
            genState.thinking = chunkState.thinking;

            if (chunkState.phase === 'thinking' && genState.firstTokenTime === null) {
              genState.firstTokenTime = Date.now() - startTime;
            } else if (chunkState.phase === 'content' && genState.firstTokenTime === null) {
              genState.firstTokenTime = chunkState.firstContentTokenTime
                ? chunkState.firstContentTokenTime - startTime
                : Date.now() - startTime;
            }

            if (chunkState.thinkingDuration) {
              genState.thinkingDuration = chunkState.thinkingDuration;
            }
          }

          const firstTokenTime = genState?.firstTokenTime;
          onChunk(id, chunkState, firstTokenTime);
        },
        state.abortController.signal
      );

      state.status = 'completed';
      state.content = resultState.content;
      state.thinking = resultState.thinking;
      state.thinkingDuration = resultState.thinkingDuration;
      const completionTime = Date.now();
      state.totalDuration = completionTime - startTime;
      // Immediately update UI for this specific model
      renderModelSelector(groups, selectedModels, true);
      updateCardStatus(id, 'completed', null, state);
      return {
        modelId: id,
        status: 'completed',
        thinking: resultState.thinking,
        content: resultState.content,
        thinkingDuration: resultState.thinkingDuration,
        firstTokenTime: state.firstTokenTime,
        totalDuration: state.totalDuration,
        timestamp: completionTime
      };

    } catch (err) {
      const completionTime = Date.now();
      const genState = activeGenerations.get(id);
      if (err.name === 'AbortError') {
        state.status = 'stopped';
        // Immediately update UI for this specific model
        renderModelSelector(groups, selectedModels, true);
        updateCardStatus(id, 'stopped', null, genState);
        return {
          modelId: id,
          status: 'stopped',
          thinking: genState?.thinking || '',
          content: genState?.content || '',
          thinkingDuration: genState?.thinkingDuration,
          firstTokenTime: genState?.firstTokenTime,
          totalDuration: completionTime - startTime,
          timestamp: completionTime
        };
      }
      state.status = 'failed';
      state.error = err.message;
      // Immediately update UI for this specific model
      renderModelSelector(groups, selectedModels, true);
      updateCardStatus(id, 'failed', err.message, genState);
      return { modelId: id, status: 'failed', error: err.message, content: '', totalDuration: completionTime - startTime, timestamp: completionTime };
    }
  });

  return Promise.all(promises);
}

// ========== Main Logic ==========

// 全局默认模型集管理
function loadDefaultSelectedModels() {
  try {
    const saved = localStorage.getItem('defaultSelectedModels');
    return saved ? JSON.parse(saved) : [];
  } catch {
    return [];
  }
}

function saveDefaultSelectedModels(models) {
  localStorage.setItem('defaultSelectedModels', JSON.stringify(models));
}

// 初始化时加载
let defaultSelectedModels = loadDefaultSelectedModels();

let currentSession = null;
let selectedModels = [];          // 当前选中模型ID数组
let activeGenerations = new Map(); // 生成中状态跟踪
let lastUserMessage = null;

async function init() {
  initDividers();
  initScrollNav();

  // 发送快捷键设置
  let sendOnEnter = true; // 默认Enter发送
  const chatInput = $('#chat-input');

  chatInput.on('keydown', e => {
    if (e.key === 'Enter') {
      if (sendOnEnter && !e.shiftKey && !e.ctrlKey) {
        e.preventDefault();
        handleSend();
      } else if (!sendOnEnter && e.ctrlKey) {
        e.preventDefault();
        handleSend();
      }
    }
  });

  // 先尝试恢复已保存的目录
  const result = await tryRestoreDirectory();

  if (!result.success) {
    // 显示选择目录弹窗，如果有待恢复的 handle 则显示"恢复目录"按钮
    showDirectoryPrompt(result.needUserAction);
  } else {
    // 如果有全局默认，设为当前选中
    if (defaultSelectedModels.length > 0) {
      selectedModels = [...defaultSelectedModels];
    }
    updateDirectoryDisplay();
    await refreshUI();
  }

  $('#btn-add-group').onclick = handleAddGroup;
  $('#btn-send').onclick = handleSend;
  $('#btn-stop').onclick = () => {
    stopAllGenerations();
    setButtonState(false, false);
    renderModelSelector(getGroups(), selectedModels, false);
  };
  $('#btn-help').onclick = () => showHelpDialog(false, pendingDirectoryHandle !== null);
  $('#btn-new-session-header').onclick = handleNewSession;
  $('#btn-delete-dir').onclick = handleDeleteDirectory;
  $('#btn-wipe-dir').onclick = handleWipeDirectory;

  // 更换目录按钮
  $('#btn-change-dir').onclick = async () => {
    const success = await selectDirectory();
    if (success) {
      pendingDirectoryHandle = null; // 清除待恢复的 handle
      updateDirectoryDisplay();
      await refreshUI();
    }
  };
}

async function handleDeleteDirectory() {
  confirmAction('确定删除当前目录配置？删除后需要重新选择目录。（磁盘上的数据文件不会被删除）', async () => {
    await clearDirectory();
    pendingDirectoryHandle = null;
    showDirectoryPrompt(false);
  });
}

async function handleWipeDirectory() {
  if (!directoryHandle) { alert('请先选择目录'); return; }

  confirmAction('确定清空磁盘上的所有数据？\n这将删除 endpoints.json 和 sessions 目录中的所有会话记录。\n此操作不可恢复！', () => {
    confirmAction('再次确认：这将永久删除所有端点配置和会话记录！', async () => {
      try {
        // 删除endpoints.json
        try {
          await directoryHandle.removeEntry('endpoints.json');
        } catch (e) {
          // 文件可能不存在
        }

        // 删除sessions目录
        try {
          await directoryHandle.removeEntry('sessions', { recursive: true });
        } catch (e) {
          // 目录可能不存在
        }

        // 清除内存和IndexedDB
        await clearDirectory();
        pendingDirectoryHandle = null;

        alert('数据已清空');
        showDirectoryPrompt(false);
      } catch (err) {
        alert('清空失败: ' + err.message);
      }
    });
  });
}

async function updateDirectoryDisplay() {
  const dirPath = $('#directory-path');
  if (directoryHandle) {
    // 尝试使用resolve()获取路径信息
    try {
      // Chrome实验性API：通过创建子目录并resolve来尝试获取更多信息
      const sessionsDir = await directoryHandle.getDirectoryHandle('sessions', { create: false });
      if ('resolve' in directoryHandle) {
        const relativePath = await directoryHandle.resolve(sessionsDir);
        // resolve返回的是相对于根目录的路径数组，但这不是完整系统路径
        // 完整系统路径浏览器无法提供（安全限制）
      }
    } catch (e) {
      // sessions目录可能不存在
    }

    dirPath.textContent = directoryHandle.name;
    dirPath.title = '当前目录: ' + directoryHandle.name;
  } else {
    dirPath.textContent = '未选择目录';
    dirPath.title = '';
  }
}

async function refreshUI() {
  const groups = getGroups();
  const isGenerating = activeGenerations.size > 0 &&
    Array.from(activeGenerations.values()).some(s => s.status === 'generating');

  renderModelSelector(groups, selectedModels, isGenerating);

  renderEndpointList(groups, null, null, handleModelEdit, handleGroupEdit, handleGroupDelete, handleAddModelForGroup, handleModelDelete, handleReorderGroups, handleReorderModels, testConnection);

  const sessions = getAllSessions();
  renderSessionList(sessions, currentSession?.id, handleSessionSelect, handleSessionEdit, handleSessionDelete);

  if (currentSession) {
    renderMessages(currentSession.messages, groups, handleCopy);
  } else {
    $('#chat-messages').innerHTML = '';
  }

  updateChatTitleDisplay();
}

function updateChatTitleDisplay() {
  if (currentSession) {
    updateChatTitle(currentSession.title);
  } else {
    updateChatTitle(null);
  }
}

async function handleSessionSelect(sessionId) {
  currentSession = await loadSession(sessionId);

  // 从会话的最后用户消息恢复模型集
  const lastUserMsg = currentSession.messages.filter(m => m.role === 'user').pop();
  if (lastUserMsg?.targetModels) {
    selectedModels = [...lastUserMsg.targetModels];
  } else {
    selectedModels = [...defaultSelectedModels];
  }

  lastUserMessage = lastUserMsg?.content || null;
  await refreshUI();
}

  const session = getSession(sessionId);
  if (session && newTitle) {
    session.title = newTitle;
    saveSession(session);
    refreshUI();

async function handleSessionDelete(sessionId) {

  }
  await refreshUI();
}

async function handleReorderGroups(draggedId, targetId, insertBefore) {

}

async function handleReorderModels(groupId, draggedModelId, targetModelId, insertBefore) {

async function handleSend() {
  const content = getInputContent();
  if (!content) return;

  if (selectedModels.length === 0) {
    selectorExpanded = true;
    renderModelSelector(getGroups(), selectedModels, false);
    return;
  }

  let isNewSession = false;
  if (!currentSession) {
    currentSession = await createSession(content, [...selectedModels]);
    isNewSession = true;
  }

  // Only addMessage if NOT a new session (createSession already added first message)
  if (!isNewSession) {
    await addMessage(currentSession.id, 'user', content, {
      targetModels: [...selectedModels]
    });
  }

  lastUserMessage = content;
  clearInput();
  setButtonState(true, true);

  // 发送后自动收起模型选择区
  selectorExpanded = false;
  renderModelSelector(getGroups(), selectedModels, true);

  const groups = getGroups();
  const messages = currentSession.messages.map(m => {
    if (m.role === 'assistant' && m.responses) {
      // Multi-model format: concatenate all successful response contents
      const content = m.responses
        .filter(r => r.status === 'completed' && r.content)
        .map(r => r.content)
        .join('\n\n---\n\n');
      return { role: m.role, content };
    }
    return { role: m.role, content: m.content || '' };
  });

  // 渲染用户消息
  renderMessages(currentSession.messages, groups, handleCopy);

  // 显示"思考中"状态卡片
  showThinkingCards(selectedModels, groups);

  // 记录已排序的模型（只排序一次）
  const sortedModels = new Set();

  // 并行调用所有模型
  const responses = await callAllModels(groups, selectedModels, messages, (modelId, partialContent, firstTokenTime) => {
    updateStreamingCard(modelId, partialContent, firstTokenTime, groups);
    // 只在firstTokenTime首次有值时排序一次
    if (firstTokenTime != null && !sortedModels.has(modelId)) {
      sortedModels.add(modelId);
      reorderCardsBySpeed();
    }
  });

  // 全部完成后保存助手消息
  await addMessage(currentSession.id, 'assistant', null, { responses });

  currentSession = await loadSession(currentSession.id);

  setButtonState(false, false);

  // 隐藏停止按钮，更新hint文字
  const stopBtnInline = $('#btn-stop-inline');
  if (stopBtnInline) {
    stopBtnInline.style.display = 'none';
  }
  const hintText = $('.multi-response-hint .hint-text');
  if (hintText) {
    const completedCount = responses.filter(r => r.status === 'completed').length;
    hintText.textContent = `${completedCount}/${responses.length}个模型已回复`;
  }

  // Don't clear activeGenerations here - keep status colors for completed models
  // Entries will be cleared when next generation starts (line 2139) or new session starts (line 2714)
  renderModelSelector(groups, selectedModels, false);
  await refreshUI();
}

function showThinkingCards(modelIds, groups) {
  const container = $('#chat-messages');

  const msgEl = mk('article', 'message');
  msgEl.id = 'streaming-multi-response';

  const hint = fromTemplate('tpl-multi-response-hint', '.multi-response-hint');
  $('.hint-text', hint).textContent = `${modelIds.length}个模型正在思考...`;
  msgEl.addChild(hint);

  // 绑定停止按钮事件
  const stopBtn = $('#btn-stop-inline', hint);
  if (stopBtn) {
    stopBtn.onclick = () => {
      stopAllGenerations();
      stopBtn.disabled = true;
      stopBtn.textContent = '已停止';
      $('.hint-text', hint).textContent = `${modelIds.length}个模型（部分已停止）`;
    };
  }

  const cards = mk('div', 'multi-response-cards');

  modelIds.forEach(id => {
    const card = fromTemplate('tpl-response-card-streaming', '.response.card');
    card.dataset.modelId = id;

    const info = findModelById(groups, id);
    const name = info ? `${info.group.name} / ${info.model.name}` : '未知';

    $('.response.model-name', card).textContent = name;

    cards.addChild(card);
  });

  msgEl.addChild(cards);
  container.addChild(msgEl);
  scrollToBottom();
}

function updateStreamingCard(modelId, state, firstTokenTime, groups) {
  // 直接更新DOM，不用requestAnimationFrame（避免并行时排队显示）
  const card = $(`.response.card[data-model-id="${modelId}"]`);
  if (!card) return;

  // thinking区块处理
  const thinkingBlock = $('.thinking-block', card);
  if (thinkingBlock) {
    if (state.thinking && state.thinking.trim()) {
      thinkingBlock.style.display = 'block';
      thinkingBlock.classList.add('streaming');

      const thinkingContent = $('.thinking-content', thinkingBlock);
      if (thinkingContent) {
        thinkingContent.textContent = state.thinking;
      }

      // 创建thinking header（如果不存在）
      let thinkingHeader = $('.thinking-header', thinkingBlock);
      if (!thinkingHeader) {
        thinkingHeader = fromTemplate('tpl-thinking-header', '.thinking-header');
        thinkingHeader.onclick = function() { toggleThinking(this); };
        const durationText = state.thinkingDuration ? `耗时 ${(state.thinkingDuration/1000).toFixed(1)}s` : '';
        $('.thinking-duration', thinkingHeader).textContent = durationText;
        thinkingBlock.insertBefore(thinkingHeader, thinkingBlock.firstChild);
      }

      // 更新thinkingDuration
      if (state.thinkingDuration) {
        const thinkingDurationEl = $('.thinking-duration', thinkingHeader);
        if (thinkingDurationEl) {
          thinkingDurationEl.textContent = `耗时 ${(state.thinkingDuration/1000).toFixed(1)}s`;
        }
      }
    } else {
      // thinking为空，隐藏思考块
      thinkingBlock.style.display = 'none';
    }
  }

  // content区块处理
  const contentEl = $('.response.card-content', card);
  if (contentEl) {
    contentEl.textContent = state.content || '';
  }

  // meta信息处理（duration等）
  if (firstTokenTime !== null) {
    const meta = $('.response.meta', card);
    if (meta) {
      // 收到第一个token时不停止动画，保持转动直到完成
      // 添加duration显示（如果不存在）
      if (!$('.response.duration', meta)) {
        const durationEl = mk('span', `response duration ${getSpeedClass(firstTokenTime)}`);
        durationEl.textContent = `反应${(firstTokenTime/1000).toFixed(1)}s`;
        const modelNameEl = $('.response.model-name', meta);
        if (modelNameEl) {
          modelNameEl.insertAdjacentElement('afterend', durationEl);
        }
      }
    }
  }
}

// Update streaming card status (for failed/stopped/completed models)
function updateCardStatus(modelId, status, error, state = null) {
  requestAnimationFrame(() => {
    const card = $(`.response.card[data-model-id="${modelId}"]`);
    if (!card) return;

    card.classList.remove('thinking');

    const contentEl = $('.response.card-content', card);
    const meta = $('.response.meta', card);

    // Update status icon with color class
    const icon = meta ? $('.model.status-icon', meta) : null;
    if (icon) {
      icon.classList.remove('spinning');
      icon.classList.add('status');
      icon.classList.add(status);
      icon.textContent = getStatusText(status);
    }

    // Update content and add error message for failed models
    if (status === 'failed') {
      if (contentEl) {
        contentEl.textContent = '';  // Empty content for failed
      }
      if (meta && error && !$('.response.error', meta)) {
        const errorEl = mk('span', 'response error');
        errorEl.textContent = error;
        const statusEl = $('.response.status', meta) || icon;
        if (statusEl) {
          statusEl.insertAdjacentElement('afterend', errorEl);
        }
      }
    } else if (status === 'stopped') {
      // Keep partial content if exists
    } else if (status === 'completed') {
      // Content already updated via updateStreamingCard

      // 更新thinking区块的duration显示
      if (state && state.thinkingDuration) {
        const thinkingBlock = $('.thinking-block', card);
        if (thinkingBlock) {
          thinkingBlock.classList.remove('streaming');
          thinkingBlock.classList.add('collapsed');

          const durationEl = $('.thinking-duration', thinkingBlock);
          if (durationEl) {
            durationEl.textContent = `耗时 ${(state.thinkingDuration/1000).toFixed(1)}s`;
          }
        }
      }

      // 更新totalDuration显示
      if (state && state.totalDuration) {
        let totalEl = $('.response.total', meta);
        if (!totalEl) {
          totalEl = mk('span', 'response total');
          // 插入到meta末尾或icon后面
          const insertAfter = $('.response.status', meta) || $('.model.status-icon', meta);
          if (insertAfter) {
            insertAfter.insertAdjacentElement('afterend', totalEl);
          } else {
            meta.addChild(totalEl);
          }
        }
        totalEl.textContent = `耗时${(state.totalDuration/1000).toFixed(1)}s`;
      }
    }
  });
}

function reorderCardsBySpeed() {
  requestAnimationFrame(() => {
    const container = $('#streaming-multi-response .multi-response-cards');
    if (!container) return;

    const cards = Array.from($$('.response.card', container));
    cards.sort((a, b) => {
      const stateA = activeGenerations.get(a.dataset.modelId);
      const stateB = activeGenerations.get(b.dataset.modelId);
      return (stateA?.firstTokenTime ?? Infinity) - (stateB?.firstTokenTime ?? Infinity);
    });

    cards.forEach(c => container.appendChild(c));
  });
}

async function handleNewSession() {
  currentSession = null;
  selectedModels = [...defaultSelectedModels]; // 新会话继承全局默认
  activeGenerations.clear();
  lastUserMessage = null;
  await refreshUI();
}

// 启动
init();
