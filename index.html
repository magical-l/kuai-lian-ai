<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天模型端点管理器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 导航栏 -->
    <div class="navbar" id="navbar">
      <div class="navbar-left">
        <div class="navbar-logo-placeholder" id="logo-placeholder">
          <!-- Logo位置预留，暂不显示 -->
        </div>
        <span class="navbar-brand">快连ai</span>
      </div>
      <div class="navbar-center">
        <span class="directory-label">当前存储目录：</span>
        <span id="directory-path" class="directory-path">未选择目录</span>
        <button id="btn-change-dir" class="btn-navbar" title="更换目录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button id="btn-delete-dir" class="btn-navbar btn-danger" title="弃用目录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button id="btn-wipe-dir" class="btn-navbar btn-danger" title="清空数据">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>
      <div class="navbar-right">
        <button id="btn-help" class="btn-navbar btn-help-icon" title="帮助">?</button>
      </div>
    </div>

    <div class="main-row" id="main-row">
    <!-- 左侧栏：端点列表 -->
    <div class="sidebar-left" id="sidebar-left">
      <div class="sidebar-header">
        <span>ai服务端点</span>
        <button id="btn-add-group" class="btn-header-action" title="新增端点">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="sidebar-content" id="endpoint-list"></div>
    </div>
    <!-- 左侧拖动分界线 -->
    <div class="divider-left" id="divider-left"></div>

    <!-- 中间：聊天界面 -->
    <div class="main-content" id="main-content">
      <div class="chat-header" id="chat-header">
        <span class="chat-header-prefix">会话：</span>
        <span id="chat-title">新会话</span>
        <button id="btn-new-session-header" title="新建会话">新建会话</button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <!-- 新增：模型选择器 -->
        <div id="model-selector" class="model-selector collapsed">
          <div class="selector-summary" id="selector-summary">
            <!-- 收起时显示已选模型标签 -->
          </div>
          <div class="selector-expand-btn" id="selector-expand-btn">
            <span id="expand-btn-text">▼ 展开</span>
          </div>
          <div class="selector-list" id="selector-list" style="display:none;">
            <!-- 展开时显示按端点分组的模型列表 -->
          </div>
        </div>

        <textarea id="chat-input" placeholder="输入消息..." rows="3"></textarea>
        <div class="chat-controls">
          <button id="btn-send">发送</button>
          <button id="btn-stop" disabled>停止</button>
          <button id="btn-new-session" title="新建会话">新建会话</button>
        </div>
      </div>
    </div>

    <!-- 右侧拖动分界线 -->
    <div class="divider-right" id="divider-right"></div>

    <!-- 右侧栏：聊天记录 -->
    <div class="sidebar-right" id="sidebar-right">
      <div class="sidebar-header">聊天记录</div>
      <div class="sidebar-content" id="session-list"></div>
    </div>
    </div>
  </div>

<script>
// ========== UI Functions ==========

function initDividers() {
  const dividerLeft = document.getElementById('divider-left');
  const dividerRight = document.getElementById('divider-right');
  const sidebarLeft = document.getElementById('sidebar-left');
  const sidebarRight = document.getElementById('sidebar-right');

  // 恢复保存的侧栏宽度
  const savedLeftWidth = localStorage.getItem('sidebar-left-width');
  const savedRightWidth = localStorage.getItem('sidebar-right-width');
  if (savedLeftWidth) sidebarLeft.style.width = savedLeftWidth;
  if (savedRightWidth) sidebarRight.style.width = savedRightWidth;

  let isDragging = false;
  let currentDivider = null;
  let startX = 0;
  let startWidth = 0;

  function startDrag(e, divider, sidebar, isLeft) {
    isDragging = true;
    currentDivider = { divider, sidebar, isLeft, storageKey: isLeft ? 'sidebar-left-width' : 'sidebar-right-width' };
    startX = e.clientX;
    startWidth = sidebar.offsetWidth;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  }

  function doDrag(e) {
    if (!isDragging || !currentDivider) return;

    const dx = e.clientX - startX;
    const newWidth = currentDivider.isLeft
      ? startWidth + dx
      : startWidth - dx;

    // 使用百分比限制到1/3
    const mainRow = document.getElementById('main-row');
    if (!mainRow) return; // 防止元素不存在时报错
    const containerWidth = mainRow.offsetWidth;
    const minWidth = 180;
    const maxWidth = containerWidth * 0.333; // 最多1/3
    const clampedWidth = Math.max(minWidth, Math.min(maxWidth, newWidth));

    currentDivider.sidebar.style.width = clampedWidth + 'px';
  }

  function stopDrag() {
    if (isDragging && currentDivider) {
      // 保存宽度到localStorage
      localStorage.setItem(currentDivider.storageKey, currentDivider.sidebar.style.width);
      isDragging = false;
      currentDivider = null;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  }

  dividerLeft.addEventListener('mousedown', (e) => {
    startDrag(e, dividerLeft, sidebarLeft, true);
  });

  dividerRight.addEventListener('mousedown', (e) => {
    startDrag(e, dividerRight, sidebarRight, false);
  });

  document.addEventListener('mousemove', doDrag);
  document.addEventListener('mouseup', stopDrag);
}

// ========== Model Selector Functions ==========

let selectorExpanded = false;

function renderModelSelector(groups, selectedModels, isGenerating) {
  const container = document.getElementById('model-selector');
  const summaryEl = document.getElementById('selector-summary');
  const listEl = document.getElementById('selector-list');
  const expandBtnText = document.getElementById('expand-btn-text');

  if (!container) return;

  // 更新容器状态
  container.classList.toggle('collapsed', !selectorExpanded);
  container.classList.toggle('generating', isGenerating);

  // 收起状态摘要
  if (selectedModels.length === 0) {
    summaryEl.innerHTML = '<span class="selector-empty-hint">请选择模型</span>';
    expandBtnText.textContent = '▼ 展开选择';
    selectorExpanded = true;
  } else {
    summaryEl.innerHTML = selectedModels.map(id => {
      const info = findModelById(groups, id);
      if (!info) return '';
      const statusClass = getTagStatusClass(id);
      const icon = getStatusIcon(id);
      const btn = isGenerating ? '' : `<span class="model-tag-btn remove-btn" data-model="${id}">✕</span>`;
      return `<span class="model-tag ${statusClass}" data-model="${id}"><span class="model-status-icon">${icon}</span>${info.model.name}${btn}</span>`;
    }).join('');
    expandBtnText.textContent = selectorExpanded ? '▲ 收起' : '▼ 展开';
  }

  // 展开状态列表
  if (selectorExpanded) {
    listEl.style.display = 'block';
    listEl.innerHTML = groups.map(g => {
      const tags = g.models.map(m => {
        const isSelected = selectedModels.includes(`${g.id}:${m.id}`);
        const cls = isSelected ? (getTagStatusClass(`${g.id}:${m.id}`) || 'selected') : 'unselected';
        const icon = isSelected ? getStatusIcon(`${g.id}:${m.id}`) : '';
        const btn = isSelected ? '<span class="model-tag-btn remove-btn">✕</span>' : '<span class="model-tag-btn add-btn">+</span>';
        return `<span class="model-tag ${cls}" data-model="${g.id}:${m.id}"><span class="model-status-icon">${icon}</span>${m.name}${btn}</span>`;
      }).join('');
      return `<div class="selector-group-label">${g.name}</div><div class="selector-models-row">${tags}</div>`;
    }).join('');
  } else {
    listEl.style.display = 'none';
  }

  bindSelectorEvents(groups, isGenerating);
}

function findModelById(groups, modelId) {
  for (const g of groups) {
    const m = g.models.find(x => `${g.id}:${x.id}` === modelId);
    if (m) return { group: g, model: m };
  }
  return null;
}

function getTagStatusClass(modelId) {
  const gen = activeGenerations.get(modelId);
  if (!gen) return '';
  if (gen.status === 'generating') {
    const t = gen.firstTokenTime;
    if (t == null) return '';
    if (t < 1000) return 'fast';
    if (t < 2000) return 'medium';
    return 'slow';
  }
  if (gen.status === 'completed') {
    const t = gen.firstTokenTime;
    if (t < 1000) return 'fast';
    if (t < 2000) return 'medium';
    return 'slow';
  }
  if (gen.status === 'failed') return 'failed';
  if (gen.status === 'stopped') return 'stopped';
  return '';
}

function getStatusIcon(modelId) {
  const gen = activeGenerations.get(modelId);
  if (!gen) return '✓';
  if (gen.status === 'generating') {
    return gen.firstTokenTime == null
      ? '<span class="model-status-icon spinning">◐</span>'
      : '<span class="model-status-icon">◐</span>';
  }
  if (gen.status === 'completed') return '✓';
  if (gen.status === 'failed') return '⚠';
  if (gen.status === 'stopped') return '■';
  return '';
}

function bindSelectorEvents(groups, isGenerating) {
  const expandBtn = document.getElementById('selector-expand-btn');
  if (expandBtn) {
    expandBtn.onclick = () => {
      if (!isGenerating) {
        selectorExpanded = !selectorExpanded;
        renderModelSelector(groups, selectedModels, false);
      }
    };
  }

  if (isGenerating) return;

  // 添加选择
  document.querySelectorAll('.model-tag-btn.add-btn').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const id = btn.closest('.model-tag').dataset.model;
      if (!selectedModels.includes(id)) {
        selectedModels.push(id);
        saveDefaultSelectedModels(selectedModels);
        renderModelSelector(groups, selectedModels, false);
      }
    };
  });

  // 移除选择
  document.querySelectorAll('.model-tag-btn.remove-btn').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const id = btn.closest('.model-tag').dataset.model;
      selectedModels = selectedModels.filter(x => x !== id);
      saveDefaultSelectedModels(selectedModels);
      renderModelSelector(groups, selectedModels, false);
    };
  });
}

function renderEndpointList(groups, selectedModelId, onModelSelect, onModelEdit, onGroupEdit, onGroupDelete, onAddModel, onModelDelete, onReorderGroups, onReorderModels, onTestConnection) {
  const container = document.getElementById('endpoint-list');
  container.innerHTML = '';

  groups.forEach((group, groupIndex) => {
    const groupEl = document.createElement('div');
    groupEl.className = 'endpoint-group';
    groupEl.dataset.groupId = group.id;
    groupEl.dataset.groupIndex = groupIndex;
    groupEl.draggable = false;

    const headerEl = document.createElement('div');
    headerEl.className = 'group-header';

    // 拖动手柄
    const dragHandle = document.createElement('span');
    dragHandle.className = 'drag-handle';
    dragHandle.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>';
    dragHandle.title = '拖动排序';
    dragHandle.draggable = true;
    dragHandle.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', group.id);
      e.dataTransfer.effectAllowed = 'move';
      groupEl.classList.add('dragging');
    });
    dragHandle.addEventListener('dragend', () => {
      groupEl.classList.remove('dragging');
      container.querySelectorAll('.endpoint-group').forEach(el => el.classList.remove('drag-over'));
    });

    // 收展三角放前面
    const toggleSpan = document.createElement('span');
    toggleSpan.className = 'group-toggle';
    toggleSpan.textContent = '▼';
    toggleSpan.addEventListener('click', (e) => {
      e.stopPropagation();
      const modelsEl = groupEl.querySelector('.group-models');
      if (modelsEl.style.display === 'none') {
        modelsEl.style.display = 'block';
        toggleSpan.textContent = '▼';
      } else {
        modelsEl.style.display = 'none';
        toggleSpan.textContent = '▶';
      }
    });

    // 组名
    const nameSpan = document.createElement('span');
    nameSpan.className = 'group-name';
    nameSpan.textContent = group.name;

    // hover tooltip 容器
    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'group-tooltip';

    const styleLabels = {
      'openai': 'OpenAI',
      'claude': 'Claude',
      'gemini': 'Gemini'
    };

    // tooltip 内容：三行信息
    tooltipEl.innerHTML = `
      <div class="tooltip-row">
        <span class="tooltip-label">名称：</span>
        <span class="tooltip-value">${group.name}</span>
        <button class="btn-tooltip-copy" data-copy="${group.name}" title="复制">⧉</button>
      </div>
      <div class="tooltip-row">
        <span class="tooltip-label">地址：</span>
        <span class="tooltip-value">${group.baseUrl}</span>
        <button class="btn-tooltip-copy" data-copy="${group.baseUrl}" title="复制">⧉</button>
      </div>
      <div class="tooltip-row">
        <span class="tooltip-label">格式：</span>
        <span class="tooltip-value">${styleLabels[group.style] || group.style}</span>
        <button class="btn-tooltip-copy" data-copy="${group.style}" title="复制">⧉</button>
      </div>
    `;

    // tooltip 复制按钮事件
    tooltipEl.querySelectorAll('.btn-tooltip-copy').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(btn.dataset.copy);
      });
    });

    // 组名容器（名称 + tooltip）
    const nameContainer = document.createElement('div');
    nameContainer.className = 'group-name-wrapper';
    nameContainer.appendChild(nameSpan);
    nameContainer.appendChild(tooltipEl);
    // 点击展开/收起模型列表
    nameContainer.addEventListener('click', () => {
      const modelsEl = groupEl.querySelector('.group-models');
      if (modelsEl) {
        if (modelsEl.style.display === 'none') {
          modelsEl.style.display = 'block';
          toggleSpan.textContent = '▼';
        } else {
          modelsEl.style.display = 'none';
          toggleSpan.textContent = '▶';
        }
      }
    });

    // 操作按钮容器（不再包含添加模型按钮）
    const actionsEl = document.createElement('div');
    actionsEl.className = 'group-actions';

    // 批量测试连接按钮
    // 检查该端点下是否有模型正在测试中
    const hasTesting = group.models.some(model => {
      const statusKey = `${group.id}:${model.id}`;
      const statusData = connectionStatus.get(statusKey);
      return statusData && statusData.status === 'testing';
    });

    const batchTestBtn = document.createElement('button');
    batchTestBtn.className = 'btn-action btn-batch-test' + (hasTesting ? ' testing' : '');
    batchTestBtn.innerHTML = hasTesting
      ? '<span class="spin">◐</span>'
      : '○';
    batchTestBtn.title = hasTesting ? '测试中...' : '批量测试连接';
    batchTestBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (onTestConnection) {
        // 测试该端点下所有模型
        group.models.forEach(model => {
          onTestConnection(group.id, model.id);
        });
      }
    });

    // 编辑按钮
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-action';
    editBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
    editBtn.title = '编辑端点';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onGroupEdit(group.id);
    });

    // 删除按钮
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn-action btn-action-danger';
    deleteBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    deleteBtn.title = '删除端点';
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('确定删除该端点及其所有模型？')) {
        onGroupDelete(group.id);
      }
    });

    actionsEl.appendChild(batchTestBtn);
    actionsEl.appendChild(editBtn);
    actionsEl.appendChild(deleteBtn);

    headerEl.appendChild(dragHandle);
    headerEl.appendChild(toggleSpan);
    headerEl.appendChild(nameContainer);
    headerEl.appendChild(actionsEl);

    // 拖放目标事件绑定到整个groupEl
    groupEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const draggingEl = container.querySelector('.dragging');
      if (draggingEl && draggingEl !== groupEl) {
        groupEl.classList.add('drag-over');
      }
    });
    groupEl.addEventListener('dragleave', () => {
      groupEl.classList.remove('drag-over');
    });
    groupEl.addEventListener('drop', (e) => {
      e.preventDefault();
      groupEl.classList.remove('drag-over');
      const draggedGroupId = e.dataTransfer.getData('text/plain');
      if (draggedGroupId !== group.id) {
        // 根据鼠标位置判断插入到目标之前还是之后
        const rect = groupEl.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        const insertBefore = e.clientY < midY;
        onReorderGroups(draggedGroupId, group.id, insertBefore);
      }
    });

    const modelsEl = document.createElement('div');
    modelsEl.className = 'group-models';

    group.models.forEach((model, modelIndex) => {
      const modelEl = document.createElement('div');
      modelEl.className = 'model-item';
      modelEl.dataset.modelId = model.id;
      modelEl.dataset.groupId = group.id;
      if (model.id === selectedModelId) {
        modelEl.classList.add('selected');
      }

      // 模型拖动手柄
      const modelDragHandle = document.createElement('span');
      modelDragHandle.className = 'drag-handle drag-handle-model';
      modelDragHandle.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>';
      modelDragHandle.title = '拖动排序';
      modelDragHandle.draggable = true;
      modelDragHandle.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', `${group.id}:${model.id}`);
        e.dataTransfer.effectAllowed = 'move';
        modelEl.classList.add('dragging');
      });
      modelDragHandle.addEventListener('dragend', () => {
        modelEl.classList.remove('dragging');
        modelsEl.querySelectorAll('.model-item').forEach(el => el.classList.remove('drag-over'));
      });

      const modelName = document.createElement('span');
      modelName.className = 'model-name';
      modelName.textContent = model.name;
      modelName.addEventListener('click', () => {
        onModelSelect(group.id, model.id);
      });

      // 模型操作按钮
      const modelActions = document.createElement('div');
      modelActions.className = 'model-actions';

      // 测试连接按钮
      const statusKey = `${group.id}:${model.id}`;
      const statusData = connectionStatus.get(statusKey) || { status: 'disconnected' };
      const status = statusData.status;
      const testBtn = document.createElement('button');
      testBtn.className = 'btn-action-small btn-connection-' + status;
      testBtn.title = getConnectionStatusText(statusKey);

      if (status === 'testing') {
        testBtn.innerHTML = '<span class="spin">◐</span>';
      } else {
        testBtn.innerHTML = '○';
      }

      testBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (onTestConnection) onTestConnection(group.id, model.id);
      });

      const modelEditBtn = document.createElement('button');
      modelEditBtn.className = 'btn-action-small';
      modelEditBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
      modelEditBtn.title = '编辑模型';
      modelEditBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        onModelEdit(group.id, model.id);
      });

      const modelDeleteBtn = document.createElement('button');
      modelDeleteBtn.className = 'btn-action-small btn-action-danger';
      modelDeleteBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
      modelDeleteBtn.title = '删除模型';
      modelDeleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('确定删除该模型？')) {
          onModelDelete(group.id, model.id);
        }
      });

      modelActions.appendChild(testBtn);
      modelActions.appendChild(modelEditBtn);
      modelActions.appendChild(modelDeleteBtn);

      modelEl.appendChild(modelDragHandle);
      modelEl.appendChild(modelName);
      modelEl.appendChild(modelActions);

      // 模型拖放目标事件
      modelEl.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const draggingEl = modelsEl.querySelector('.dragging');
        if (draggingEl && draggingEl !== modelEl) {
          modelEl.classList.add('drag-over');
        }
      });
      modelEl.addEventListener('dragleave', () => {
        modelEl.classList.remove('drag-over');
      });
      modelEl.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        modelEl.classList.remove('drag-over');
        const data = e.dataTransfer.getData('text/plain');
        const [draggedGroupId, draggedModelId] = data.split(':');
        if (draggedGroupId === group.id && draggedModelId !== model.id && onReorderModels) {
          const rect = modelEl.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          const insertBefore = e.clientY < midY;
          onReorderModels(group.id, draggedModelId, model.id, insertBefore);
        }
      });

      modelsEl.appendChild(modelEl);
    });

    // 添加模型按钮放在模型列表底部
    const addModelBtn = document.createElement('div');
    addModelBtn.className = 'add-model-link';
    addModelBtn.textContent = '+ 添加模型';
    addModelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      // 显示内联输入框而非弹窗
      const existingInput = modelsEl.querySelector('.add-model-inline');
      if (existingInput) existingInput.remove();

      const inlineInput = document.createElement('div');
      inlineInput.className = 'add-model-inline';
      inlineInput.innerHTML = `
        <input type="text" placeholder="模型名" class="add-model-input">
        <button class="add-model-confirm btn-action-small">✓</button>
        <button class="add-model-cancel btn-action-small">✗</button>
      `;
      modelsEl.insertBefore(inlineInput, addModelBtn);

      const inputEl = inlineInput.querySelector('.add-model-input');
      inputEl.focus();

      inlineInput.querySelector('.add-model-confirm').addEventListener('click', async (e2) => {
        e2.stopPropagation();
        const name = inputEl.value.trim();
        if (name) {
          inlineInput.remove();
          onAddModel(group.id, name);
        }
      });

      inlineInput.querySelector('.add-model-cancel').addEventListener('click', (e2) => {
        e2.stopPropagation();
        inlineInput.remove();
      });

      inputEl.addEventListener('keydown', (e2) => {
        if (e2.key === 'Enter') {
          e2.preventDefault();
          inlineInput.querySelector('.add-model-confirm').click();
        } else if (e2.key === 'Escape') {
          inlineInput.remove();
        }
      });
    });
    modelsEl.appendChild(addModelBtn);

    groupEl.appendChild(headerEl);
    groupEl.appendChild(modelsEl);
    container.appendChild(groupEl);
  });
}

function renderMessages(messages, groups, onCopy) {

  container.innerHTML = '';

  messages.forEach((msg, index) => {

    msgEl.className = 'message';

    if (msg.role === 'user') {
      const metaEl = document.createElement('div');
      metaEl.className = 'message-meta message-meta-user';
      const timeStr = msg.timestamp ? formatDateTime(msg.timestamp) : '';
      metaEl.textContent = '我 · ' + timeStr;
      msgEl.appendChild(metaEl);

      const userEl = document.createElement('div');
      userEl.className = 'message-user';
      userEl.textContent = msg.content;
      msgEl.appendChild(userEl);

      // 用户消息状态栏：复制按钮
      const statusBar = document.createElement('div');
      statusBar.className = 'message-status-bar message-status-bar-user';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn-icon';
      copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      copyBtn.title = '复制';
      copyBtn.addEventListener('click', () => onCopy(msg.content));

      statusBar.appendChild(copyBtn);
      msgEl.appendChild(statusBar);
    } else {
      // 检测消息格式
      if (msg.responses && Array.isArray(msg.responses)) {
        renderMultiModelResponse(msgEl, msg, groups, onCopy);
      } else {
        renderSingleModelResponse(msgEl, msg, groups, onCopy);  // 向后兼容
      }
    }

    container.appendChild(msgEl);
  });

  container.scrollTop = container.scrollHeight;
}

function renderSingleModelResponse(msgEl, msg, groups, onCopy) {
  // 模型名和时间放一起
  const metaEl = document.createElement('div');
  metaEl.className = 'message-meta';
  if (msg.endpointGroupId && msg.modelId) {
    const group = groups.find(g => g.id === msg.endpointGroupId);
    const model = group?.models.find(m => m.id === msg.modelId);
    const modelName = model ? `${group?.name} / ${model.name}` : '未知模型';
    const timeStr = msg.timestamp ? formatDateTime(msg.timestamp) : '';
    metaEl.innerHTML = `<span>${modelName}</span><span style="margin-left: var(--space-2)">${timeStr}</span>`;
  }
  msgEl.appendChild(metaEl);

  const assistantEl = document.createElement('div');
  assistantEl.className = 'message-assistant';
  assistantEl.textContent = msg.content;
  msgEl.appendChild(assistantEl);

  // 状态栏：复制、元信息
  const statusBar = document.createElement('div');
  statusBar.className = 'message-status-bar';

  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn-icon';
  copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

function renderMultiModelResponse(msgEl, msg, groups, onCopy) {
  const sorted = [...msg.responses].sort((a, b) =>
    (a.firstTokenTime ?? Infinity) - (b.firstTokenTime ?? Infinity)
  );

  const hint = document.createElement('div');
  hint.className = 'multi-response-hint';
  hint.textContent = `${sorted.length}个模型回复`;
  msgEl.appendChild(hint);

  const cards = document.createElement('div');
  cards.className = 'multi-response-cards';

  sorted.forEach(r => {
    const card = document.createElement('div');
    card.className = 'response-card';

    const info = findModelById(groups, r.modelId);
    const name = info ? `${info.group.name} / ${info.model.name}` : '未知';

    const header = document.createElement('div');
    header.className = 'response-card-header';
    header.innerHTML = `<span class="response-model-name">${name}</span>
      <span class="response-status ${r.status}">${getStatusText(r.status)}</span>`;
    if (r.firstTokenTime) {
      header.innerHTML += `<span class="response-first-token">${(r.firstTokenTime/1000).toFixed(1)}s</span>`;
    }
    card.appendChild(header);

    const content = document.createElement('div');
    content.className = 'response-card-content';
    if (r.status === 'failed') {
      content.innerHTML = `<span style="color:var(--danger)">错误: ${r.error || '未知'}</span>`;
    } else if (r.status === 'stopped') {
      content.innerHTML = `<span style="color:var(--text-muted)">已停止</span>`;
      if (r.content) content.innerHTML += `<br>${r.content}`;
    } else {
      content.textContent = r.content || '';
    }
    card.appendChild(content);

    cards.appendChild(card);
  });

  msgEl.appendChild(cards);
}

function getStatusText(status) {
  return { completed: '✓', failed: '⚠', stopped: '■' }[status] || status;
}

function formatDateTime(timestamp) {
  const date = new Date(timestamp);
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  const hour = String(date.getHours()).padStart(2, '0');
  const minute = String(date.getMinutes()).padStart(2, '0');
  const second = String(date.getSeconds()).padStart(2, '0');
  return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
}

function closeHelpDialog(dialog, overlay, immediate = false) {
  const helpBtn = document.getElementById('btn-help');
  if (!helpBtn) {
    dialog.remove();
    overlay.remove();
    return;
  }

  const btnRect = helpBtn.getBoundingClientRect();
  const dialogRect = dialog.getBoundingClientRect();

  if (!immediate) {
    // 计算按钮中心位置
    const btnCenterX = btnRect.left + btnRect.width / 2;
    const btnCenterY = btnRect.top + btnRect.height / 2;

    // 计算对话框中心位置
    const dialogCenterX = dialogRect.left + dialogRect.width / 2;
    const dialogCenterY = dialogRect.top + dialogRect.height / 2;

    // 计算需要移动的距离
    const translateX = btnCenterX - dialogCenterX;
    const translateY = btnCenterY - dialogCenterY;

    // 设置动画 - 不改变透明度
    dialog.style.setProperty('transition', 'transform 0.4s ease-in', 'important');
    dialog.style.setProperty('transform-origin', 'center center', 'important');

    // 强制浏览器重新计算样式
    dialog.offsetHeight;

    // 设置最终状态 - 缩小到按钮位置
    dialog.style.setProperty('transform', `translate(calc(-50% + ${translateX}px), calc(-50% + ${translateY}px)) scale(0.05)`, 'important');

    setTimeout(() => {
      dialog.remove();
      overlay.remove();
    }, 400);
  } else {
    dialog.remove();
    overlay.remove();
  }
}

  const minute = String(date.getMinutes()).padStart(2, '0');
  const second = String(date.getSeconds()).padStart(2, '0');
  return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
}

function getConnectionStatusText(key) {
  const data = connectionStatus.get(key);
  if (!data) return '测试连接：未测试';

  const statusText = {
    'testing': '测试中...',
    'connected': '✓ 连接成功',
    'failed': '✗',
    'cors_blocked': '⚠ 该端点禁止浏览器直连'
  };

  const text = statusText[data.status] || '未测试';
  const timeStr = data.timestamp ? formatTimestamp(data.timestamp) : '';
  const errorInfo = data.error ? ` (${data.error})` : '';

  return data.status === 'testing'
    ? '测试连接：测试中...'
    : `测试连接：${text}${errorInfo}（${timeStr}）`;
}

async function testConnection(groupId, modelId) {
  const group = getGroup(groupId);
  const model = getModel(groupId, modelId);
  if (!group || !model) return;

  const key = `${groupId}:${modelId}`;
  connectionStatus.set(key, { status: 'testing', timestamp: null });
  renderEndpointList(getGroups(), null, handleModelSelect, handleModelEdit, handleGroupEdit, handleGroupDelete, handleAddModelForGroup, handleModelDelete, handleReorderGroups, handleReorderModels, testConnection);

  try {
    // 发送一个简单的测试请求
    const testMessages = [{ role: 'user', content: 'hi' }];
    let response = null;
    let styleType = group.style;

    if (group.style === 'openai') {
      const url = `${group.baseUrl}/v1/chat/completions`;
      response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${group.key}`
        },
        body: JSON.stringify({
          model: model.name,
          messages: testMessages,
          max_tokens: 1
        })
      });
    } else if (group.style === 'claude') {
      const url = `${group.baseUrl}/v1/messages`;
      response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': group.key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: model.name,
          max_tokens: 1,
          messages: testMessages
        })
      });
    } else if (group.style === 'gemini') {
      const url = `${group.baseUrl}/v1beta/models/${model.name}:generateContent?key=${group.key}`;
      response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: 'hi' }] }]
        })
      });
    }

    if (response && response.ok) {
      connectionStatus.set(key, {
        status: 'connected',
        timestamp: Date.now()
      });
    } else if (response) {
      // 尝试读取错误信息
      let errorMsg = `HTTP ${response.status}`;
      try {
        const errorBody = await response.text();
        // 尝试解析 JSON 获取更详细的错误
        try {
          const errorJson = JSON.parse(errorBody);
          if (errorJson.error?.message) {
            errorMsg = errorJson.error.message;
          } else if (errorJson.message) {
            errorMsg = errorJson.message;
          }
        } catch (e) {
          // 非 JSON，截取前 100 字符
          if (errorBody && errorBody.length < 100) {
            errorMsg = errorBody;
          }
        }
      } catch (e) {}

      connectionStatus.set(key, {
        status: 'failed',
        timestamp: Date.now(),
        error: errorMsg
      });
    }
  } catch (err) {
    // CORS 错误表现为 TypeError: Failed to fetch，没有 response
    const isCorsError = err instanceof TypeError && (
      err.message.includes('Failed to fetch') ||
      err.message.includes('NetworkError') ||
      err.name === 'TypeError'
    );
    connectionStatus.set(key, {
      status: isCorsError ? 'cors_blocked' : 'failed',
      timestamp: Date.now(),
      error: isCorsError ? null : err.message
    });
  }

  renderEndpointList(getGroups(), null, handleModelSelect, handleModelEdit, handleGroupEdit, handleGroupDelete, handleAddModelForGroup, handleModelDelete, handleReorderGroups, handleReorderModels, testConnection);
}

// IndexedDB 操作
const DB_NAME = 'endpoint-manager';
const STORE_NAME = 'handles';

async function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => resolve(request.result);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

async function saveHandleToIndexedDB(handle) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put(handle, 'directory');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function loadHandleFromIndexedDB() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const request = store.get('directory');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function clearHandleFromIndexedDB() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.delete('directory');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 尝试恢复已保存的目录
async function tryRestoreDirectory() {
  try {
    const savedHandle = await loadHandleFromIndexedDB();
    if (!savedHandle) return { success: false, needUserAction: false };

    // 检查当前权限状态
    const perm = await savedHandle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      directoryHandle = savedHandle;
      await ensureDirectoryStructure();
      await loadEndpoints();
      await loadSessionsIndex();
      return { success: true, needUserAction: false };
    }

    // 权限不足，需要用户点击来请求权限
    // 保存 handle 供后续使用
    pendingDirectoryHandle = savedHandle;
    return { success: false, needUserAction: true };
  } catch (err) {
    console.error('恢复目录失败:', err);
    return { success: false, needUserAction: false };
  }
}

// 待恢复的目录 handle（需要用户点击后才能请求权限）
let pendingDirectoryHandle = null;

// 用户点击后请求权限并恢复目录
async function requestPermissionAndRestore() {
  if (!pendingDirectoryHandle) return false;
  try {
    const perm = await pendingDirectoryHandle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      directoryHandle = pendingDirectoryHandle;
      pendingDirectoryHandle = null;
      await ensureDirectoryStructure();
      await loadEndpoints();
      await loadSessionsIndex();
      return true;
    }
    return false;
  } catch (err) {
    console.error('请求权限失败:', err);
    return false;
  }
}

function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// 获取当前目录名称（用于显示）
async function getDirectoryPath() {
  if (!directoryHandle) return null;

  // 尝试使用Chrome实验性的resolve()方法获取完整路径
  try {
    // Chromium 85+ 支持的实验性API
    if ('resolve' in directoryHandle) {
      // resolve需要传入一个子项来获取相对路径，这里用根目录本身
      const root = await directoryHandle.getDirectoryHandle('', { create: false });
      const path = await directoryHandle.resolve(root);
      if (path && path.length > 0) {
        return path.join('/');
      }
    }
  } catch (e) {
    // 实验性API可能不存在或失败
  }

  // 尝试获取完整路径的另一种方式（Chrome特定）
  try {
    // 某些Chrome版本支持直接访问路径属性
    const entries = await directoryHandle.values();
    for await (const entry of entries) {
      // 通过resolve获取子项的路径
      if ('resolve' in directoryHandle) {
        const relativePath = await directoryHandle.resolve(entry);
        if (relativePath && relativePath.length > 0) {
          // 这只能获取相对路径，无法获取完整系统路径
          break;
        }
      }
    }
  } catch (e) {}

  // 降级方案：只显示目录名称
  return directoryHandle.name;
}

async function reorderGroups(draggedId, targetId, insertBefore = true) {
  if (!endpointsData) endpointsData = { groups: [] };
  const draggedIndex = endpointsData.groups.findIndex(g => g.id === draggedId);
  const targetIndex = endpointsData.groups.findIndex(g => g.id === targetId);
  if (draggedIndex >= 0 && targetIndex >= 0) {
    const [draggedGroup] = endpointsData.groups.splice(draggedIndex, 1);
    // 如果从前往后拖且insertBefore为true，需要调整位置
    // 如果从后往前拖且insertBefore为false，也需要调整
    let insertIndex = targetIndex;
    if (draggedIndex < targetIndex) {
      insertIndex = insertBefore ? targetIndex - 1 : targetIndex;
    } else if (draggedIndex > targetIndex) {
      insertIndex = insertBefore ? targetIndex : targetIndex + 1;
    }
    endpointsData.groups.splice(insertIndex, 0, draggedGroup);
    await saveEndpoints();
    return true;
  }
  return false;
}

  const session = sessionsCache.get(sessionId);
  if (!session) return null;

  const message = { role, content, timestamp: Date.now() };

  if (role === 'user') {
    // 用户消息：记录targetModels
    if (options.targetModels) {
      message.targetModels = options.targetModels;
    }
  } else if (role === 'assistant') {
    // 助手消息：多模型responses数组
    if (options.responses) {
      message.responses = options.responses;
    }
    // 兼容旧格式：单模型消息
    if (options.modelId && !options.responses) {
      message.modelId = options.modelId;
      message.endpointGroupId = options.endpointGroupId;
      if (options.usage) message.usage = options.usage;
    }
  }

  // 更新标题逻辑保持不变
  if (role === 'user' && session.messages.filter(m => m.role === 'user').length === 1) {
    session.title = content.slice(0, 20);
  }

  session.messages.push(message);
  await saveSession(session);
  return message;
}

let currentAbortController = null;

function stopGeneration() {
  if (currentAbortController) {
    currentAbortController.abort();
    currentAbortController = null;
  }
}

function stopSingleGeneration(modelId) {
  const state = activeGenerations.get(modelId);
  if (state && state.abortController) {
    state.abortController.abort();
  }
}

function stopAllGenerations() {
  activeGenerations.forEach((state, id) => {
    if (state.abortController && state.status === 'generating') {
      state.abortController.abort();
    }
  });
}

function isGenerating() {
  return currentAbortController !== null;
}

async function callOpenAI(baseUrl, apiKey, model, messages, onChunk, signal = null) {
  const url = `${baseUrl}/v1/chat/completions`;
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${apiKey}`
  };
  const body = {
    model,
    messages,
    stream: true
  };

  // 如果没有传入signal，创建新的AbortController（单模型模式）
  const useSignal = signal || (currentAbortController = new AbortController()).signal;
  let fullContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: useSignal
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(`API错误: ${response.status} - ${error}`);
    }

    if (!response.body) {
      throw new Error('Response body is empty');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;

          try {
            const json = JSON.parse(data);
            const content = json.choices?.[0]?.delta?.content;
            if (content) {
              fullContent += content;
              onChunk(fullContent);
            }
          } catch (e) {}
        }
      }
    }

    return fullContent;
  } catch (e) {
    if (e.name === 'AbortError') {
      return fullContent || '';
    }
    throw e;
  } finally {
    // 只在单模型模式下清理currentAbortController
    if (!signal) {
      currentAbortController = null;
    }
  }
}

async function callClaude(baseUrl, apiKey, model, messages, onChunk, signal = null) {
  const url = `${baseUrl}/v1/messages`;
  const headers = {
    'Content-Type': 'application/json',
    'x-api-key': apiKey,
    'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true'
  };

  const claudeMessages = messages.map(m => ({
    role: m.role,
    content: m.content
  }));

  const body = {
    model,
    max_tokens: 4096,
    messages: claudeMessages,
    stream: true
  };

  // 如果没有传入signal，创建新的AbortController（单模型模式）
  const useSignal = signal || (currentAbortController = new AbortController()).signal;
  let fullContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: useSignal
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(`API错误: ${response.status} - ${error}`);
    }

    if (!response.body) {
      throw new Error('Response body is empty');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);

          try {
            const json = JSON.parse(data);
            if (json.type === 'content_block_delta' && json.delta?.text) {
              fullContent += json.delta.text;
              onChunk(fullContent);
            }
          } catch (e) {}
        }
      }
    }

    return fullContent;
  } catch (e) {
    if (e.name === 'AbortError') {
      return fullContent || '';
    }
    throw e;
  } finally {
    // 只在单模型模式下清理currentAbortController
    if (!signal) {
      currentAbortController = null;
    }
  }
}

async function callGemini(baseUrl, apiKey, model, messages, onChunk, signal = null) {
  const url = `${baseUrl}/v1beta/models/${model}:streamGenerateContent?key=${apiKey}&alt=sse`;

  const contents = [];
  let currentRole = null;
  let currentParts = [];

  for (const msg of messages) {
    const role = msg.role === 'user' ? 'user' : 'model';
    if (currentRole !== role) {
      if (currentRole !== null) {
        contents.push({ role: currentRole, parts: currentParts });
      }
      currentRole = role;
      currentParts = [];
    }
    currentParts.push({ text: msg.content });
  }
  if (currentRole !== null) {
    contents.push({ role: currentRole, parts: currentParts });
  }

  const body = { contents };

  // 如果没有传入signal，创建新的AbortController（单模型模式）
  const useSignal = signal || (currentAbortController = new AbortController()).signal;
  let fullContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: useSignal
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(`API错误: ${response.status} - ${error}`);
    }

    if (!response.body) {
      throw new Error('Response body is empty');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);

          try {
            const json = JSON.parse(data);
            const text = json.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              fullContent += text;
              onChunk(fullContent);
            }
          } catch (e) {}
        }
      }
    }

    return fullContent;
  } catch (e) {
    if (e.name === 'AbortError') {
      return fullContent || '';
    }
    throw e;
  } finally {
    // 只在单模型模式下清理currentAbortController
    if (!signal) {
      currentAbortController = null;
    }
  }
}

async function callAPI(style, baseUrl, apiKey, model, messages, onChunk, signal = null) {
  switch (style) {
    case 'openai':
      return await callOpenAI(baseUrl, apiKey, model, messages, onChunk, signal);
    case 'claude':
      return await callClaude(baseUrl, apiKey, model, messages, onChunk, signal);
    case 'gemini':
      return await callGemini(baseUrl, apiKey, model, messages, onChunk, signal);
    default:
      throw new Error(`不支持的接口风格: ${style}`);
  }
}

// 并行调用所有模型
async function callAllModels(groups, modelIds, messages, onChunk) {
  const startTime = Date.now();
  activeGenerations.clear();

  // 初始化每个模型的状态和AbortController
  modelIds.forEach(id => {
    activeGenerations.set(id, {
      abortController: new AbortController(),
      status: 'generating',
      firstTokenTime: null,
      startTime,
      content: ''
    });
  });

  // 并行调用所有模型
  const promises = modelIds.map(async id => {
    const info = findModelById(groups, id);
    const state = activeGenerations.get(id);

    if (!info) {
      state.status = 'failed';
      state.error = '模型不存在';
      return { modelId: id, status: 'failed', error: '模型不存在', content: null };
    }

    try {
      const content = await callAPI(
        info.group.style,
        info.group.baseUrl,
        info.group.key,
        info.model.name,
        messages,
        chunk => {
          if (state.firstTokenTime === null) {
            state.firstTokenTime = Date.now() - startTime;
          }
          state.content = chunk;
          onChunk(id, chunk, state.firstTokenTime);
        },
        state.abortController.signal
      );

      state.status = 'completed';
      return {
        modelId: id,
        status: 'completed',
        content,
        firstTokenTime: state.firstTokenTime
      };

    } catch (err) {
      if (err.name === 'AbortError') {
        state.status = 'stopped';
        return { modelId: id, status: 'stopped', content: state.content || '' };
      }
      state.status = 'failed';
      state.error = err.message;
      return { modelId: id, status: 'failed', error: err.message, content: null };
    }
  });

  return Promise.all(promises);
}

// ========== Main Logic ==========

// 全局默认模型集管理
function loadDefaultSelectedModels() {
  try {
    const saved = localStorage.getItem('defaultSelectedModels');
    return saved ? JSON.parse(saved) : [];
  } catch {
    return [];
  }
}

function saveDefaultSelectedModels(models) {
  localStorage.setItem('defaultSelectedModels', JSON.stringify(models));
}

// 初始化时加载
let defaultSelectedModels = loadDefaultSelectedModels();

let currentSession = null;
let selectedModels = [];          // 当前选中模型ID数组
let activeGenerations = new Map(); // 生成中状态跟踪
let lastUserMessage = null;

async function init() {
  initDividers();

  // 发送快捷键设置
  let sendOnEnter = true; // 默认Enter发送
  const chatInput = document.getElementById('chat-input');

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (sendOnEnter && !e.shiftKey && !e.ctrlKey) {
        e.preventDefault();
        handleSend();
      } else if (!sendOnEnter && e.ctrlKey) {
        e.preventDefault();
        handleSend();
      }
    }
  });

  // 先尝试恢复已保存的目录
  const result = await tryRestoreDirectory();

  if (!result.success) {
    // 显示选择目录弹窗，如果有待恢复的 handle 则显示"恢复目录"按钮
    showDirectoryPrompt(result.needUserAction);
  } else {
    // 如果有全局默认，设为当前选中
    if (defaultSelectedModels.length > 0) {
      selectedModels = [...defaultSelectedModels];
    }
    updateDirectoryDisplay();
    await refreshUI();
  }

  document.getElementById('btn-add-group').onclick = handleAddGroup;
  document.getElementById('btn-send').onclick = handleSend;
  document.getElementById('btn-stop').onclick = handleStop;
  document.getElementById('btn-help').onclick = () => showHelpDialog(false, pendingDirectoryHandle !== null);
  document.getElementById('btn-new-session').onclick = handleNewSession;
  document.getElementById('btn-new-session-header').onclick = handleNewSession;
  document.getElementById('btn-delete-dir').onclick = handleDeleteDirectory;
  document.getElementById('btn-wipe-dir').onclick = handleWipeDirectory;

  // 更换目录按钮
  document.getElementById('btn-change-dir').onclick = async () => {
    const success = await selectDirectory();
    if (success) {
      pendingDirectoryHandle = null; // 清除待恢复的 handle
      updateDirectoryDisplay();
      await refreshUI();
    }
  };
}

async function handleDeleteDirectory() {
  if (confirm('确定删除当前目录配置？删除后需要重新选择目录。（磁盘上的数据文件不会被删除）')) {
    await clearDirectory();
    pendingDirectoryHandle = null;
    showDirectoryPrompt(false); // 弹出帮助弹窗让用户选择新目录
  }
}

async function handleWipeDirectory() {
  if (!directoryHandle) {
    alert('请先选择目录');
    return;
  }

  if (confirm('确定清空磁盘上的所有数据？\n这将删除 endpoints.json 和 sessions 目录中的所有会话记录。\n此操作不可恢复！')) {
    if (confirm('再次确认：这将永久删除所有端点配置和聊天记录！')) {
      try {
        // 删除endpoints.json
        try {
          await directoryHandle.removeEntry('endpoints.json');
        } catch (e) {
          // 文件可能不存在
        }

        // 删除sessions目录
        try {
          await directoryHandle.removeEntry('sessions', { recursive: true });
        } catch (e) {
          // 目录可能不存在
        }

        // 清除内存和IndexedDB
        await clearDirectory();
        pendingDirectoryHandle = null;

        alert('数据已清空');
        showDirectoryPrompt(false); // 让用户重新选择目录或使用当前目录
      } catch (err) {
        alert('清空失败: ' + err.message);
      }
    }
  }
}

async function updateDirectoryDisplay() {
  const dirPath = document.getElementById('directory-path');
  if (directoryHandle) {
    // 尝试使用resolve()获取路径信息
    try {
      // Chrome实验性API：通过创建子目录并resolve来尝试获取更多信息
      const sessionsDir = await directoryHandle.getDirectoryHandle('sessions', { create: false });
      if ('resolve' in directoryHandle) {
        const relativePath = await directoryHandle.resolve(sessionsDir);
        // resolve返回的是相对于根目录的路径数组，但这不是完整系统路径
        // 完整系统路径浏览器无法提供（安全限制）
      }
    } catch (e) {
      // sessions目录可能不存在
    }

    dirPath.textContent = directoryHandle.name;
    dirPath.title = '当前目录: ' + directoryHandle.name;
  } else {
    dirPath.textContent = '未选择目录';
    dirPath.title = '';
  }
}

async function refreshUI() {
  const groups = getGroups();
  renderEndpointList(groups, null, handleModelSelect, handleModelEdit, handleGroupEdit, handleGroupDelete, handleAddModelForGroup, handleModelDelete, handleReorderGroups, handleReorderModels, testConnection);

  const sessions = getAllSessions();
  renderSessionList(sessions, currentSession?.id, handleSessionSelect, handleSessionEdit, handleSessionDelete);

  if (currentSession) {
    renderMessages(currentSession.messages, groups, handleCopy);
  } else {
    document.getElementById('chat-messages').innerHTML = '';
  }

  updateChatTitleDisplay();
}

function updateChatTitleDisplay() {
  if (currentSession) {
    updateChatTitle(currentSession.title);
  } else {
    updateChatTitle(null);
  }
}

async function handleSend() {
  const content = getInputContent();
  if (!content) return;

  // TODO: Multi-model selection - use selectedModels array
  // For now, check if any model is selected
  if (selectedModels.length === 0) {
    alert('请先选择一个模型');
    return;
  }

  if (!currentSession) {
    currentSession = await createSession(content);
  } else {
    await addMessage(currentSession.id, 'user', content);
  }

  lastUserMessage = content;
  clearInput();
  setButtonState(true, false);

  const groups = getGroups();
  renderMessages(currentSession.messages, groups, handleCopy);

  // TODO: Handle multiple selected models - for now use the first one
  const firstSelected = selectedModels[0];
  const [groupId, modelId] = firstSelected.split(':');
  const group = getGroup(groupId);
  const model = getModel(groupId, modelId);

  appendMessage('assistant', '', `${group.name} / ${model.name}`);

  try {
    const messages = currentSession.messages.map(m => ({
      role: m.role,
      content: m.content
    }));

    const fullResponse = await callAPI(
      group.style,
      group.baseUrl,
      group.key,
      model.name,
      messages,
      updateStreamingMessage
    );

    finishStreamingMessage();
    await addMessage(currentSession.id, 'assistant', fullResponse, { endpointGroupId: groupId, modelId: modelId });

    currentSession = await loadSession(currentSession.id);

    setButtonState(false, true);
    await refreshUI();

  } catch (err) {
    finishStreamingMessage();
    alert(`API调用失败: ${err.message}`);
    setButtonState(false, true);
  }
}

function handleStop() {
  stopGeneration();
  setButtonState(false, true);
}

async function handleNewSession() {
  currentSession = null;
  selectedModels = [...defaultSelectedModels]; // 新会话继承全局默认
  activeGenerations.clear();
  lastUserMessage = null;
  await refreshUI();
}

async function handleRegenerate() {
  // TODO: Multi-model selection - use selectedModels array
  if (!lastUserMessage || selectedModels.length === 0) return;

  if (currentSession && currentSession.messages.length > 0) {
    const lastMsg = currentSession.messages[currentSession.messages.length - 1];
    if (lastMsg.role === 'assistant') {
      currentSession.messages.pop();
      await saveSession(currentSession);
    }
  }

  setButtonState(true, false);

  const groups = getGroups();
  renderMessages(currentSession.messages, groups, handleCopy);

  // TODO: Handle multiple selected models - for now use the first one
  const firstSelected = selectedModels[0];
  const [groupId, modelId] = firstSelected.split(':');
  const group = getGroup(groupId);
  const model = getModel(groupId, modelId);

  appendMessage('assistant', '', `${group.name} / ${model.name}`);

  try {
    const messages = currentSession.messages.map(m => ({
      role: m.role,
      content: m.content
    }));

    const fullResponse = await callAPI(
      group.style,
      group.baseUrl,
      group.key,
      model.name,
      messages,
      updateStreamingMessage
    );

    finishStreamingMessage();
    await addMessage(currentSession.id, 'assistant', fullResponse, { endpointGroupId: groupId, modelId: modelId });

    setButtonState(false, true);
    await refreshUI();

  } catch (err) {
    finishStreamingMessage();
    if (err.name !== 'AbortError') {
      alert(`API调用失败: ${err.message}`);
    }
    setButtonState(false, true);
  }
}
