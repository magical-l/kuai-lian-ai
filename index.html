<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天模型端点管理器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部工作目录栏 -->
    <div class="directory-bar" id="directory-bar">
      <button id="btn-change-dir" class="btn-dir-change" title="更换目录">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <span id="directory-path" class="directory-path">未选择目录</span>
    </div>

    <div class="main-row">
    <!-- 左侧栏：端点列表 -->
    <div class="sidebar-left" id="sidebar-left">
      <div class="sidebar-header">
        <span>端点</span>
        <button id="btn-add-group" class="btn-header-action" title="新增端点">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="sidebar-content" id="endpoint-list"></div>
    </div>
    <!-- 左侧拖动分界线 -->
    <div class="divider-left" id="divider-left"></div>

    <!-- 中间：聊天界面 -->
    <div class="main-content" id="main-content">
      <div class="chat-header" id="chat-header">
        <span id="chat-title">新会话</span>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <textarea id="chat-input" placeholder="输入消息..." rows="3"></textarea>
        <div class="chat-controls">
          <button id="btn-send">发送</button>
          <button id="btn-stop" disabled>停止</button>
        </div>
      </div>
    </div>

    <!-- 右侧拖动分界线 -->
    <div class="divider-right" id="divider-right"></div>

    <!-- 右侧栏：聊天记录 -->
    <div class="sidebar-right" id="sidebar-right">
      <div class="sidebar-header">聊天记录</div>
      <div class="sidebar-content" id="session-list"></div>
    </div>
    </div>
  </div>

<script>
// ========== UI Functions ==========

function initDividers() {
  const dividerLeft = document.getElementById('divider-left');
  const dividerRight = document.getElementById('divider-right');
  const sidebarLeft = document.getElementById('sidebar-left');
  const sidebarRight = document.getElementById('sidebar-right');

  let isDragging = false;
  let currentDivider = null;
  let startX = 0;
  let startWidth = 0;

  function startDrag(e, divider, sidebar, isLeft) {
    isDragging = true;
    currentDivider = { divider, sidebar, isLeft };
    startX = e.clientX;
    startWidth = sidebar.offsetWidth;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  }

  function doDrag(e) {
    if (!isDragging || !currentDivider) return;

    const dx = e.clientX - startX;
    const newWidth = currentDivider.isLeft
      ? startWidth + dx
      : startWidth - dx;

    const minWidth = 150;
    const maxWidth = 400;
    const clampedWidth = Math.max(minWidth, Math.min(maxWidth, newWidth));

    currentDivider.sidebar.style.width = clampedWidth + 'px';
  }

  function stopDrag() {
    if (isDragging) {
      isDragging = false;
      currentDivider = null;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  }

  dividerLeft.addEventListener('mousedown', (e) => {
    startDrag(e, dividerLeft, sidebarLeft, true);
  });

  dividerRight.addEventListener('mousedown', (e) => {
    startDrag(e, dividerRight, sidebarRight, false);
  });

  document.addEventListener('mousemove', doDrag);
  document.addEventListener('mouseup', stopDrag);
}

function renderEndpointList(groups, selectedGroupId, selectedModelId, onGroupSelect, onModelSelect, onGroupEdit, onModelEdit, onGroupDelete, onAddModel, onModelDelete, onReorderGroups) {
  const container = document.getElementById('endpoint-list');
  container.innerHTML = '';

  groups.forEach((group, groupIndex) => {
    const groupEl = document.createElement('div');
    groupEl.className = 'endpoint-group';
    groupEl.dataset.groupId = group.id;
    groupEl.dataset.groupIndex = groupIndex;
    groupEl.draggable = false;

    const headerEl = document.createElement('div');
    headerEl.className = 'group-header';
    if (group.id === selectedGroupId) {
      headerEl.classList.add('selected');
    }

    // 拖动手柄
    const dragHandle = document.createElement('span');
    dragHandle.className = 'drag-handle';
    dragHandle.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>';
    dragHandle.title = '拖动排序';
    dragHandle.draggable = true;
    dragHandle.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', group.id);
      e.dataTransfer.effectAllowed = 'move';
      groupEl.classList.add('dragging');
    });
    dragHandle.addEventListener('dragend', () => {
      groupEl.classList.remove('dragging');
      container.querySelectorAll('.endpoint-group').forEach(el => el.classList.remove('drag-over'));
    });

    // 收展三角放前面
    const toggleSpan = document.createElement('span');
    toggleSpan.className = 'group-toggle';
    toggleSpan.textContent = '▼';
    toggleSpan.addEventListener('click', (e) => {
      e.stopPropagation();
      const modelsEl = groupEl.querySelector('.group-models');
      if (modelsEl.style.display === 'none') {
        modelsEl.style.display = 'block';
        toggleSpan.textContent = '▼';
      } else {
        modelsEl.style.display = 'none';
        toggleSpan.textContent = '▶';
      }
    });

    // 组名
    const nameSpan = document.createElement('span');
    nameSpan.className = 'group-name';
    nameSpan.textContent = group.name;
    nameSpan.addEventListener('click', () => {
      onGroupSelect(group.id);
    });

    // 操作按钮容器（不再包含添加模型按钮）
    const actionsEl = document.createElement('div');
    actionsEl.className = 'group-actions';

    // 编辑按钮
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-action';
    editBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
    editBtn.title = '编辑端点';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onGroupEdit(group.id);
    });

    // 删除按钮
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn-action btn-action-danger';
    deleteBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    deleteBtn.title = '删除端点';
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('确定删除该端点及其所有模型？')) {
        onGroupDelete(group.id);
      }
    });

    actionsEl.appendChild(editBtn);
    actionsEl.appendChild(deleteBtn);

    headerEl.appendChild(dragHandle);
    headerEl.appendChild(toggleSpan);
    headerEl.appendChild(nameSpan);
    headerEl.appendChild(actionsEl);

    // 拖放目标事件绑定到整个groupEl
    groupEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const draggingEl = container.querySelector('.dragging');
      if (draggingEl && draggingEl !== groupEl) {
        groupEl.classList.add('drag-over');
      }
    });
    groupEl.addEventListener('dragleave', () => {
      groupEl.classList.remove('drag-over');
    });
    groupEl.addEventListener('drop', (e) => {
      e.preventDefault();
      groupEl.classList.remove('drag-over');
      const draggedGroupId = e.dataTransfer.getData('text/plain');
      if (draggedGroupId !== group.id) {
        onReorderGroups(draggedGroupId, group.id);
      }
    });

    const modelsEl = document.createElement('div');
    modelsEl.className = 'group-models';

    group.models.forEach(model => {
      const modelEl = document.createElement('div');
      modelEl.className = 'model-item';
      if (model.id === selectedModelId) {
        modelEl.classList.add('selected');
      }

      const modelName = document.createElement('span');
      modelName.className = 'model-name';
      modelName.textContent = model.name;
      modelName.addEventListener('click', () => {
        onModelSelect(group.id, model.id);
      });

      // 模型操作按钮
      const modelActions = document.createElement('div');
      modelActions.className = 'model-actions';

      const modelEditBtn = document.createElement('button');
      modelEditBtn.className = 'btn-action-small';
      modelEditBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
      modelEditBtn.title = '编辑模型';
      modelEditBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        onModelEdit(group.id, model.id);
      });

      const modelDeleteBtn = document.createElement('button');
      modelDeleteBtn.className = 'btn-action-small btn-action-danger';
      modelDeleteBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
      modelDeleteBtn.title = '删除模型';
      modelDeleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('确定删除该模型？')) {
          onModelDelete(group.id, model.id);
        }
      });

      modelActions.appendChild(modelEditBtn);
      modelActions.appendChild(modelDeleteBtn);

      modelEl.appendChild(modelName);
      modelEl.appendChild(modelActions);
      modelsEl.appendChild(modelEl);
    });

    // 添加模型按钮放在模型列表底部
    const addModelBtn = document.createElement('div');
    addModelBtn.className = 'add-model-link';
    addModelBtn.textContent = '+ 添加模型';
    addModelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onAddModel(group.id);
    });
    modelsEl.appendChild(addModelBtn);

    groupEl.appendChild(headerEl);
    groupEl.appendChild(modelsEl);
    container.appendChild(groupEl);
  });
}

function renderSessionList(sessions, selectedSessionId, onSessionSelect, onSessionEdit, onSessionDelete) {
  const container = document.getElementById('session-list');
  container.innerHTML = '';

  sessions.sort((a, b) => b.createdAt - a.createdAt);

  sessions.forEach(session => {
    const sessionEl = document.createElement('div');
    sessionEl.className = 'session-item';
    if (session.id === selectedSessionId) {
      sessionEl.classList.add('selected');
    }

    const titleEl = document.createElement('div');
    titleEl.className = 'session-title';
    titleEl.textContent = session.title || '新会话';

    const metaEl = document.createElement('div');
    metaEl.className = 'session-meta';

    const timeEl = document.createElement('span');
    timeEl.className = 'session-time';
    timeEl.textContent = new Date(session.createdAt).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });

    // 操作按钮
    const actionsEl = document.createElement('div');
    actionsEl.className = 'session-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'btn-action-small';
    editBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
    editBtn.title = '编辑标题';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onSessionEdit(session.id);
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn-action-small btn-action-danger';
    deleteBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    deleteBtn.title = '删除会话';
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('确定删除该会话？')) {
        onSessionDelete(session.id);
      }
    });

    actionsEl.appendChild(editBtn);
    actionsEl.appendChild(deleteBtn);

    metaEl.appendChild(timeEl);
    metaEl.appendChild(actionsEl);

    sessionEl.appendChild(titleEl);
    sessionEl.appendChild(metaEl);
    sessionEl.addEventListener('click', () => {
      onSessionSelect(session.id);
    });

    container.appendChild(sessionEl);
  });
}

function renderMessages(messages, groups, onCopy) {
  const container = document.getElementById('chat-messages');
  container.innerHTML = '';

  messages.forEach((msg, index) => {
    const msgEl = document.createElement('div');
    msgEl.className = 'message';

    if (msg.role === 'user') {
      const metaEl = document.createElement('div');
      metaEl.className = 'message-meta message-meta-user';
      const timeStr = msg.timestamp ? formatDateTime(msg.timestamp) : '';
      metaEl.textContent = timeStr;
      msgEl.appendChild(metaEl);

      const userEl = document.createElement('div');
      userEl.className = 'message-user';
      userEl.textContent = msg.content;
      msgEl.appendChild(userEl);
    } else {
      // 模型名和时间放一起
      const metaEl = document.createElement('div');
      metaEl.className = 'message-meta';
      if (msg.endpointGroupId && msg.modelId) {
        const group = groups.find(g => g.id === msg.endpointGroupId);
        const model = group?.models.find(m => m.id === msg.modelId);
        const modelName = model ? `${group?.name} / ${model.name}` : '未知模型';
        const timeStr = msg.timestamp ? ` · ${formatDateTime(msg.timestamp)}` : '';
        metaEl.textContent = modelName + timeStr;
      }
      msgEl.appendChild(metaEl);

      const assistantEl = document.createElement('div');
      assistantEl.className = 'message-assistant';
      assistantEl.textContent = msg.content;
      msgEl.appendChild(assistantEl);

      // 状态栏：复制、元信息
      const statusBar = document.createElement('div');
      statusBar.className = 'message-status-bar';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn-icon';
      copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      copyBtn.title = '复制';
      copyBtn.addEventListener('click', () => onCopy(msg.content));

      statusBar.appendChild(copyBtn);

      // 元信息（如有）
      if (msg.usage) {
        const usageEl = document.createElement('span');
        usageEl.className = 'message-usage';
        usageEl.textContent = `${msg.usage.input || 0} → ${msg.usage.output || 0} tokens`;
        statusBar.appendChild(usageEl);
      }

      msgEl.appendChild(statusBar);
    }

    container.appendChild(msgEl);
  });

  container.scrollTop = container.scrollHeight;
}

function formatDateTime(timestamp) {
  const date = new Date(timestamp);
  const now = new Date();
  const isToday = date.toDateString() === now.toDateString();
  const isYesterday = new Date(now - 86400000).toDateString() === date.toDateString();

  if (isToday) {
    return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  } else if (isYesterday) {
    return '昨天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  } else {
    return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }
}

function appendMessage(role, content, meta = null) {
  const container = document.getElementById('chat-messages');

  const msgEl = document.createElement('div');
  msgEl.className = 'message';

  if (role === 'user') {
    const metaEl = document.createElement('div');
    metaEl.className = 'message-meta message-meta-user';
    metaEl.textContent = formatDateTime(Date.now());
    msgEl.appendChild(metaEl);

    const userEl = document.createElement('div');
    userEl.className = 'message-user';
    userEl.textContent = content;
    msgEl.appendChild(userEl);
  } else {
    if (meta) {
      const metaEl = document.createElement('div');
      metaEl.className = 'message-meta';
      metaEl.textContent = meta + ' · ' + formatDateTime(Date.now());
      msgEl.appendChild(metaEl);
    }

    const assistantEl = document.createElement('div');
    assistantEl.className = 'message-assistant';
    assistantEl.id = 'streaming-message';
    assistantEl.textContent = content;
    msgEl.appendChild(assistantEl);
  }

  container.appendChild(msgEl);
  container.scrollTop = container.scrollHeight;

  return msgEl;
}

function updateStreamingMessage(content) {
  const el = document.getElementById('streaming-message');
  if (el) {
    el.textContent = content;
    el.parentElement.parentElement.scrollTop = el.parentElement.parentElement.scrollHeight;
  }
}

function finishStreamingMessage() {
  const el = document.getElementById('streaming-message');
  if (el) {
    el.removeAttribute('id');
  }
}

function updateChatTitle(title) {
  const el = document.getElementById('chat-title');
  el.textContent = title || '新会话';
}

function getInputContent() {
  const input = document.getElementById('chat-input');
  return input.value.trim();
}

function clearInput() {
  const input = document.getElementById('chat-input');
  input.value = '';
}

function setButtonState(sendDisabled, stopDisabled) {
  document.getElementById('btn-send').disabled = sendDisabled;
  document.getElementById('btn-stop').disabled = stopDisabled;
}

function showEditGroupDialog(group = null, onSave) {
  const existing = document.getElementById('edit-dialog');
  if (existing) existing.remove();

  const dialog = document.createElement('div');
  dialog.id = 'edit-dialog';

  dialog.innerHTML = `
    <h3>${group ? '编辑端点' : '新增端点'}</h3>
    <div class="dialog-form">
      <label>名称: <input id="dialog-group-name" value="${group?.name || ''}"></label>
      <label>Base URL: <input id="dialog-group-url" value="${group?.baseUrl || ''}"></label>
      <label>接口风格:
        <select id="dialog-group-style">
          <option value="openai" ${group?.style === 'openai' ? 'selected' : ''}>OpenAI</option>
          <option value="claude" ${group?.style === 'claude' ? 'selected' : ''}>Claude</option>
          <option value="gemini" ${group?.style === 'gemini' ? 'selected' : ''}>Gemini</option>
        </select>
      </label>
      <label>API Key: <input id="dialog-group-key" type="password" value="${group?.key || ''}"></label>
    </div>
    <div class="dialog-buttons">
      <button id="dialog-cancel">取消</button>
      <button id="dialog-save" class="primary">保存</button>
    </div>
  `;

  document.body.appendChild(dialog);

  document.getElementById('dialog-cancel').onclick = () => dialog.remove();
  document.getElementById('dialog-save').onclick = () => {
    const name = document.getElementById('dialog-group-name').value.trim();
    const baseUrl = document.getElementById('dialog-group-url').value.trim();
    const style = document.getElementById('dialog-group-style').value;
    const key = document.getElementById('dialog-group-key').value.trim();

    if (!name || !baseUrl) {
      alert('请填写名称和Base URL');
      return;
    }

    onSave({ name, baseUrl, style, key });
    dialog.remove();
  };
}

function showEditModelDialog(groupId, model = null, onSave) {
  const existing = document.getElementById('edit-dialog');
  if (existing) existing.remove();

  const dialog = document.createElement('div');
  dialog.id = 'edit-dialog';

  dialog.innerHTML = `
    <h3>${model ? '编辑模型' : '新增模型'}</h3>
    <div class="dialog-form">
      <label>模型名: <input id="dialog-model-name" value="${model?.name || ''}"></label>
    </div>
    <div class="dialog-buttons">
      <button id="dialog-cancel">取消</button>
      <button id="dialog-save" class="primary">保存</button>
    </div>
  `;

  document.body.appendChild(dialog);

  document.getElementById('dialog-cancel').onclick = () => dialog.remove();
  document.getElementById('dialog-save').onclick = () => {
    const name = document.getElementById('dialog-model-name').value.trim();
    if (!name) {
      alert('请输入模型名');
      return;
    }
    onSave(name);
    dialog.remove();
  };
}

function updateDirectoryDisplay() {
  const dirInfo = document.getElementById('directory-info');
  const dirName = getDirectoryName();
  if (dirName) {
    dirInfo.textContent = `[${dirName}]`;
    dirInfo.style.display = 'inline';
  } else {
    dirInfo.textContent = '';
    dirInfo.style.display = 'none';
  }
}

function showDirectoryPrompt() {
  const existing = document.getElementById('directory-prompt');
  if (existing) existing.remove();

  const prompt = document.createElement('div');
  prompt.id = 'directory-prompt';
  prompt.innerHTML = `
    <h3>选择存储目录</h3>
    <p>请选择一个目录来存储端点配置和聊天记录</p>
    <button id="btn-select-dir">选择目录</button>
  `;
  document.body.appendChild(prompt);

  return prompt;
}

function hideDirectoryPrompt() {
  const prompt = document.getElementById('directory-prompt');
  if (prompt) prompt.remove();
}

// ========== Store Functions ==========

let directoryHandle = null;
let endpointsData = null;
let sessionsCache = new Map();

// IndexedDB 操作
const DB_NAME = 'endpoint-manager';
const STORE_NAME = 'handles';

async function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => resolve(request.result);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

async function saveHandleToIndexedDB(handle) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put(handle, 'directory');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function loadHandleFromIndexedDB() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const request = store.get('directory');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function clearHandleFromIndexedDB() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.delete('directory');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 尝试恢复已保存的目录
async function tryRestoreDirectory() {
  try {
    const savedHandle = await loadHandleFromIndexedDB();
    if (!savedHandle) return false;

    // 检查权限
    const perm = await savedHandle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      directoryHandle = savedHandle;
      await ensureDirectoryStructure();
      await loadEndpoints();
      await loadSessionsIndex();
      return true;
    }

    // 尝试重新请求权限
    if (perm === 'prompt') {
      const newPerm = await savedHandle.requestPermission({ mode: 'readwrite' });
      if (newPerm === 'granted') {
        directoryHandle = savedHandle;
        await ensureDirectoryStructure();
        await loadEndpoints();
        await loadSessionsIndex();
        return true;
      }
    }

    return false;
  } catch (err) {
    console.error('恢复目录失败:', err);
    return false;
  }
}

function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

async function selectDirectory() {
  try {
    directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await saveHandleToIndexedDB(directoryHandle);
    await ensureDirectoryStructure();
    await loadEndpoints();
    await loadSessionsIndex();
    return true;
  } catch (err) {
    console.error('选择目录失败:', err);
    return false;
  }
}

// 获取当前目录名称（用于显示）
function getDirectoryName() {
  return directoryHandle?.name || null;
}

async function ensureDirectoryStructure() {
  if (!directoryHandle) return;
  try {
    await directoryHandle.getDirectoryHandle('sessions', { create: true });
  } catch (err) {
    console.error('创建sessions目录失败:', err);
  }
}

async function loadEndpoints() {
  if (!directoryHandle) {
    endpointsData = { groups: [] };
    return endpointsData;
  }
  try {
    const fileHandle = await directoryHandle.getFileHandle('endpoints.json', { create: true });
    const file = await fileHandle.getFile();
    const text = await file.text();
    endpointsData = text ? JSON.parse(text) : { groups: [] };
    return endpointsData;
  } catch (err) {
    console.error('加载端点配置失败:', err);
    endpointsData = { groups: [] };
    return endpointsData;
  }
}

async function saveEndpoints() {
  if (!directoryHandle) return false;
  try {
    const fileHandle = await directoryHandle.getFileHandle('endpoints.json', { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(endpointsData, null, 2));
    await writable.close();
    return true;
  } catch (err) {
    console.error('保存端点配置失败:', err);
    return false;
  }
}

function getGroups() {
  if (!endpointsData) endpointsData = { groups: [] };
  return endpointsData.groups || [];
}

async function addGroup(name, baseUrl, style, key) {
  if (!endpointsData) endpointsData = { groups: [] };
  if (!directoryHandle) {
    alert('请先选择存储目录');
    return null;
  }
  const group = {
    id: generateUUID(),
    name,
    baseUrl,
    style,
    key,
    models: []
  };
  endpointsData.groups.push(group);
  await saveEndpoints();
  return group;
}

async function updateGroup(groupId, updates) {
  if (!endpointsData) endpointsData = { groups: [] };
  const group = endpointsData.groups.find(g => g.id === groupId);
  if (group) {
    Object.assign(group, updates);
    await saveEndpoints();
    return group;
  }
  return null;
}

async function deleteGroup(groupId) {
  if (!endpointsData) endpointsData = { groups: [] };
  const index = endpointsData.groups.findIndex(g => g.id === groupId);
  if (index >= 0) {
    endpointsData.groups.splice(index, 1);
    await saveEndpoints();
    return true;
  }
  return false;
}

async function reorderGroups(draggedId, targetId) {
  if (!endpointsData) endpointsData = { groups: [] };
  const draggedIndex = endpointsData.groups.findIndex(g => g.id === draggedId);
  const targetIndex = endpointsData.groups.findIndex(g => g.id === targetId);
  if (draggedIndex >= 0 && targetIndex >= 0) {
    const [draggedGroup] = endpointsData.groups.splice(draggedIndex, 1);
    endpointsData.groups.splice(targetIndex, 0, draggedGroup);
    await saveEndpoints();
    return true;
  }
  return false;
}

async function addModel(groupId, modelName) {
  if (!endpointsData) endpointsData = { groups: [] };
  const group = endpointsData.groups.find(g => g.id === groupId);
  if (group) {
    const model = {
      id: generateUUID(),
      name: modelName
    };
    group.models.push(model);
    await saveEndpoints();
    return model;
  }
  return null;
}

async function updateModel(groupId, modelId, newName) {
  if (!endpointsData) endpointsData = { groups: [] };
  const group = endpointsData.groups.find(g => g.id === groupId);
  const model = group?.models?.find(m => m.id === modelId);
  if (model) {
    model.name = newName;
    await saveEndpoints();
    return model;
  }
  return null;
}

async function deleteModel(groupId, modelId) {
  if (!endpointsData) endpointsData = { groups: [] };
  const group = endpointsData.groups.find(g => g.id === groupId);
  if (group) {
    const index = group.models?.findIndex(m => m.id === modelId) ?? -1;
    if (index >= 0) {
      group.models.splice(index, 1);
      await saveEndpoints();
      return true;
    }
  }
  return false;
}

function getModel(groupId, modelId) {
  if (!endpointsData) endpointsData = { groups: [] };
  const group = endpointsData.groups.find(g => g.id === groupId);
  return group?.models?.find(m => m.id === modelId);
}

function getGroup(groupId) {
  if (!endpointsData) endpointsData = { groups: [] };
  return endpointsData.groups.find(g => g.id === groupId);
}

async function loadSessionsIndex() {
  if (!directoryHandle) return [];
  try {
    const sessionsDir = await directoryHandle.getDirectoryHandle('sessions');
    sessionsCache.clear();

    for await (const handle of sessionsDir.values()) {
      if (handle.kind === 'file' && handle.name.endsWith('.json')) {
        const file = await handle.getFile();
        const text = await file.text();
        const session = JSON.parse(text);
        sessionsCache.set(session.id, session);
      }
    }

    return Array.from(sessionsCache.values());
  } catch (err) {
    console.error('加载会话索引失败:', err);
    return [];
  }
}

function getAllSessions() {
  return Array.from(sessionsCache.values());
}

async function createSession(firstMessage = null) {
  const session = {
    id: generateUUID(),
    title: firstMessage ? firstMessage.slice(0, 20) : '新会话',
    createdAt: Date.now(),
    messages: []
  };

  if (firstMessage) {
    session.messages.push({ role: 'user', content: firstMessage });
  }

  sessionsCache.set(session.id, session);
  await saveSession(session);
  return session;
}

async function loadSession(sessionId) {
  if (sessionsCache.has(sessionId)) {
    return sessionsCache.get(sessionId);
  }

  if (!directoryHandle) return null;
  try {
    const sessionsDir = await directoryHandle.getDirectoryHandle('sessions');
    const fileHandle = await sessionsDir.getFileHandle(`${sessionId}.json`);
    const file = await fileHandle.getFile();
    const text = await file.text();
    const session = JSON.parse(text);
    sessionsCache.set(session.id, session);
    return session;
  } catch (err) {
    console.error('加载会话失败:', err);
    return null;
  }
}

async function saveSession(session) {
  if (!directoryHandle) return false;
  try {
    const sessionsDir = await directoryHandle.getDirectoryHandle('sessions');
    const fileHandle = await sessionsDir.getFileHandle(`${session.id}.json`, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(session, null, 2));
    await writable.close();
    return true;
  } catch (err) {
    console.error('保存会话失败:', err);
    return false;
  }
}

async function addMessage(sessionId, role, content, endpointGroupId = null, modelId = null, usage = null) {
  const session = sessionsCache.get(sessionId);
  if (session) {
    const message = { role, content, timestamp: Date.now() };
    if (role === 'assistant') {
      if (endpointGroupId && modelId) {
        message.endpointGroupId = endpointGroupId;
        message.modelId = modelId;
      }
      if (usage) {
        message.usage = usage;
      }
    }
    session.messages.push(message);

    if (role === 'user' && session.messages.filter(m => m.role === 'user').length === 1) {
      session.title = content.slice(0, 20);
    }

    await saveSession(session);
    return message;
  }
  return null;
}

function getSession(sessionId) {
  return sessionsCache.get(sessionId);
}

async function deleteSession(sessionId) {
  if (!directoryHandle) return false;
  try {
    sessionsCache.delete(sessionId);
    const sessionsDir = await directoryHandle.getDirectoryHandle('sessions');
    await sessionsDir.removeEntry(`${sessionId}.json`);
    return true;
  } catch (err) {
    console.error('删除会话失败:', err);
    return false;
  }
}

function hasDirectory() {
  return directoryHandle !== null;
}

// ========== API Functions ==========

let currentAbortController = null;

function stopGeneration() {
  if (currentAbortController) {
    currentAbortController.abort();
    currentAbortController = null;
  }
}

function isGenerating() {
  return currentAbortController !== null;
}

async function callOpenAI(baseUrl, apiKey, model, messages, onChunk) {
  const url = `${baseUrl}/v1/chat/completions`;
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${apiKey}`
  };
  const body = {
    model,
    messages,
    stream: true
  };

  currentAbortController = new AbortController();
  let fullContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: currentAbortController.signal
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(`API错误: ${response.status} - ${error}`);
    }

    if (!response.body) {
      throw new Error('Response body is empty');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;

          try {
            const json = JSON.parse(data);
            const content = json.choices?.[0]?.delta?.content;
            if (content) {
              fullContent += content;
              onChunk(fullContent);
            }
          } catch (e) {}
        }
      }
    }

    return fullContent;
  } catch (e) {
    if (e.name === 'AbortError') {
      return fullContent || '';
    }
    throw e;
  } finally {
    currentAbortController = null;
  }
}

async function callClaude(baseUrl, apiKey, model, messages, onChunk) {
  const url = `${baseUrl}/v1/messages`;
  const headers = {
    'Content-Type': 'application/json',
    'x-api-key': apiKey,
    'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true'
  };

  const claudeMessages = messages.map(m => ({
    role: m.role,
    content: m.content
  }));

  const body = {
    model,
    max_tokens: 4096,
    messages: claudeMessages,
    stream: true
  };

  currentAbortController = new AbortController();
  let fullContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: currentAbortController.signal
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(`API错误: ${response.status} - ${error}`);
    }

    if (!response.body) {
      throw new Error('Response body is empty');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);

          try {
            const json = JSON.parse(data);
            if (json.type === 'content_block_delta' && json.delta?.text) {
              fullContent += json.delta.text;
              onChunk(fullContent);
            }
          } catch (e) {}
        }
      }
    }

    return fullContent;
  } catch (e) {
    if (e.name === 'AbortError') {
      return fullContent || '';
    }
    throw e;
  } finally {
    currentAbortController = null;
  }
}

async function callGemini(baseUrl, apiKey, model, messages, onChunk) {
  const url = `${baseUrl}/v1beta/models/${model}:streamGenerateContent?key=${apiKey}&alt=sse`;

  const contents = [];
  let currentRole = null;
  let currentParts = [];

  for (const msg of messages) {
    const role = msg.role === 'user' ? 'user' : 'model';
    if (currentRole !== role) {
      if (currentRole !== null) {
        contents.push({ role: currentRole, parts: currentParts });
      }
      currentRole = role;
      currentParts = [];
    }
    currentParts.push({ text: msg.content });
  }
  if (currentRole !== null) {
    contents.push({ role: currentRole, parts: currentParts });
  }

  const body = { contents };

  currentAbortController = new AbortController();
  let fullContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: currentAbortController.signal
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(`API错误: ${response.status} - ${error}`);
    }

    if (!response.body) {
      throw new Error('Response body is empty');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);

          try {
            const json = JSON.parse(data);
            const text = json.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              fullContent += text;
              onChunk(fullContent);
            }
          } catch (e) {}
        }
      }
    }

    return fullContent;
  } catch (e) {
    if (e.name === 'AbortError') {
      return fullContent || '';
    }
    throw e;
  } finally {
    currentAbortController = null;
  }
}

async function callAPI(style, baseUrl, apiKey, model, messages, onChunk) {
  switch (style) {
    case 'openai':
      return await callOpenAI(baseUrl, apiKey, model, messages, onChunk);
    case 'claude':
      return await callClaude(baseUrl, apiKey, model, messages, onChunk);
    case 'gemini':
      return await callGemini(baseUrl, apiKey, model, messages, onChunk);
    default:
      throw new Error(`不支持的接口风格: ${style}`);
  }
}

// ========== Main Logic ==========

let currentSession = null;
let currentGroupId = null;
let currentModelId = null;
let lastUserMessage = null;

async function init() {
  initDividers();

  // 发送快捷键设置
  let sendOnEnter = true; // 默认Enter发送
  const chatInput = document.getElementById('chat-input');

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (sendOnEnter && !e.shiftKey && !e.ctrlKey) {
        e.preventDefault();
        handleSend();
      } else if (!sendOnEnter && e.ctrlKey) {
        e.preventDefault();
        handleSend();
      }
    }
  });

  // 先尝试恢复已保存的目录
  const restored = await tryRestoreDirectory();

  if (!restored) {
    const prompt = showDirectoryPrompt();
    document.getElementById('btn-select-dir').onclick = async () => {
      const success = await selectDirectory();
      hideDirectoryPrompt();
      if (success) {
        updateDirectoryDisplay();
        await refreshUI();
      }
    };
  } else {
    updateDirectoryDisplay();
    await refreshUI();
  }

  document.getElementById('btn-add-group').onclick = handleAddGroup;
  document.getElementById('btn-send').onclick = handleSend;
  document.getElementById('btn-stop').onclick = handleStop;

  // 更换目录按钮
  document.getElementById('btn-change-dir').onclick = async () => {
    const success = await selectDirectory();
    if (success) {
      updateDirectoryDisplay();
      await refreshUI();
    }
  };
}

function updateDirectoryDisplay() {
  const dirPath = document.getElementById('directory-path');
  if (directoryHandle) {
    // 尝试获取完整路径（可能需要权限）
    dirPath.textContent = directoryHandle.name;
    dirPath.title = '当前目录: ' + directoryHandle.name;
  } else {
    dirPath.textContent = '未选择目录';
    dirPath.title = '';
  }
}

async function refreshUI() {
  const groups = getGroups();
  renderEndpointList(groups, currentGroupId, currentModelId, handleGroupSelect, handleModelSelect, handleGroupEdit, handleModelEdit, handleGroupDelete, handleAddModelForGroup, handleModelDelete, handleReorderGroups);

  const sessions = getAllSessions();
  renderSessionList(sessions, currentSession?.id, handleSessionSelect, handleSessionEdit, handleSessionDelete);

  if (currentSession) {
    renderMessages(currentSession.messages, groups, handleCopy);
  } else {
    document.getElementById('chat-messages').innerHTML = '';
  }

  updateChatTitleDisplay();
}

function updateChatTitleDisplay() {
  if (currentSession) {
    updateChatTitle(currentSession.title);
  } else {
    updateChatTitle(null);
  }
}

function handleGroupSelect(groupId) {
  currentGroupId = groupId;
  currentModelId = null;
  renderEndpointList(getGroups(), currentGroupId, currentModelId, handleGroupSelect, handleModelSelect, handleGroupEdit, handleModelEdit, handleGroupDelete, handleAddModelForGroup, handleModelDelete, handleReorderGroups);
}

async function handleModelSelect(groupId, modelId) {
  currentGroupId = groupId;
  currentModelId = modelId;
  renderEndpointList(getGroups(), currentGroupId, currentModelId, handleGroupSelect, handleModelSelect, handleGroupEdit, handleModelEdit, handleGroupDelete, handleAddModelForGroup, handleModelDelete, handleReorderGroups);
}

async function handleSessionSelect(sessionId) {
  currentSession = await loadSession(sessionId);

  const lastAssistant = currentSession.messages.filter(m => m.role === 'assistant').pop();
  if (lastAssistant?.endpointGroupId && lastAssistant?.modelId) {
    currentGroupId = lastAssistant.endpointGroupId;
    currentModelId = lastAssistant.modelId;
  }

  // 更新 lastUserMessage 为当前 session 的最后一条用户消息
  const lastUserMsg = currentSession.messages.filter(m => m.role === 'user').pop();
  lastUserMessage = lastUserMsg?.content || null;

  await refreshUI();
}

function handleSessionEdit(sessionId) {
  const session = getSession(sessionId);
  const newTitle = prompt('编辑会话标题:', session?.title || '新会话');
  if (newTitle && newTitle.trim()) {
    session.title = newTitle.trim();
    saveSession(session);
    refreshUI();
  }
}

async function handleSessionDelete(sessionId) {
  await deleteSession(sessionId);
  if (currentSession?.id === sessionId) {
    currentSession = null;
  }
  await refreshUI();
}

function handleAddGroup() {
  showEditGroupDialog(null, async (data) => {
    await addGroup(data.name, data.baseUrl, data.style, data.key);
    await refreshUI();
  });
}

function handleGroupEdit(groupId) {
  const group = getGroup(groupId);
  showEditGroupDialog(group, async (data) => {
    await updateGroup(groupId, data);
    await refreshUI();
  });
}

async function handleGroupDelete(groupId) {
  await deleteGroup(groupId);
  if (currentGroupId === groupId) {
    currentGroupId = null;
    currentModelId = null;
  }
  await refreshUI();
}

function handleAddModel() {
  if (!currentGroupId) {
    alert('请先选择一个端点');
    return;
  }
  showEditModelDialog(currentGroupId, null, async (name) => {
    await addModel(currentGroupId, name);
    await refreshUI();
  });
}

function handleAddModelForGroup(groupId) {
  showEditModelDialog(groupId, null, async (name) => {
    await addModel(groupId, name);
    await refreshUI();
  });
}

function handleCopy(content) {
  navigator.clipboard.writeText(content).then(() => {
    // 可选：显示复制成功提示
  });
}

function handleModelEdit(groupId, modelId) {
  const model = getModel(groupId, modelId);
  showEditModelDialog(groupId, model, async (name) => {
    await updateModel(groupId, modelId, name);
    await refreshUI();
  });
}

async function handleModelDelete(groupId, modelId) {
  await deleteModel(groupId, modelId);
  if (currentModelId === modelId) {
    currentModelId = null;
  }
  await refreshUI();
}

async function handleReorderGroups(draggedId, targetId) {
  await reorderGroups(draggedId, targetId);
  await refreshUI();
}

async function handleSend() {
  const content = getInputContent();
  if (!content) return;

  if (!currentGroupId || !currentModelId) {
    alert('请先选择一个模型');
    return;
  }

  if (!currentSession) {
    currentSession = await createSession(content);
  } else {
    await addMessage(currentSession.id, 'user', content);
  }

  lastUserMessage = content;
  clearInput();
  setButtonState(true, false);

  const groups = getGroups();
  renderMessages(currentSession.messages, groups, handleCopy);

  const group = getGroup(currentGroupId);
  const model = getModel(currentGroupId, currentModelId);

  appendMessage('assistant', '', `${group.name} / ${model.name}`);

  try {
    const messages = currentSession.messages.map(m => ({
      role: m.role,
      content: m.content
    }));

    const fullResponse = await callAPI(
      group.style,
      group.baseUrl,
      group.key,
      model.name,
      messages,
      updateStreamingMessage
    );

    finishStreamingMessage();
    await addMessage(currentSession.id, 'assistant', fullResponse, currentGroupId, currentModelId);

    currentSession = await loadSession(currentSession.id);

    setButtonState(false, true);
    await refreshUI();

  } catch (err) {
    finishStreamingMessage();
    alert(`API调用失败: ${err.message}`);
    setButtonState(false, true);
  }
}

function handleStop() {
  stopGeneration();
  setButtonState(false, true);
}

async function handleRegenerate() {
  if (!lastUserMessage || !currentGroupId || !currentModelId) return;

  if (currentSession && currentSession.messages.length > 0) {
    const lastMsg = currentSession.messages[currentSession.messages.length - 1];
    if (lastMsg.role === 'assistant') {
      currentSession.messages.pop();
      await saveSession(currentSession);
    }
  }

  setButtonState(true, false);

  const groups = getGroups();
  renderMessages(currentSession.messages, groups, handleCopy);

  const group = getGroup(currentGroupId);
  const model = getModel(currentGroupId, currentModelId);

  appendMessage('assistant', '', `${group.name} / ${model.name}`);

  try {
    const messages = currentSession.messages.map(m => ({
      role: m.role,
      content: m.content
    }));

    const fullResponse = await callAPI(
      group.style,
      group.baseUrl,
      group.key,
      model.name,
      messages,
      updateStreamingMessage
    );

    finishStreamingMessage();
    await addMessage(currentSession.id, 'assistant', fullResponse, currentGroupId, currentModelId);

    setButtonState(false, true);
    await refreshUI();

  } catch (err) {
    finishStreamingMessage();
    if (err.name !== 'AbortError') {
      alert(`API调用失败: ${err.message}`);
    }
    setButtonState(false, true);
  }
}

// 启动
init();
</script>
</body>
</html>
