<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快连AI</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../vendor/highlight-github.min.css">
<link href="https://css.lwj621.workers.dev/css/common.css" rel="stylesheet">
<link href="https://css.lwj621.workers.dev/css/layout.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="hidden">
	<symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
		<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
	</symbol>
	<symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
		<path d="M3 6h18"></path>
		<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
		<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
		<path d="M12 6v16"></path>
	</symbol>
	<symbol id="icon-sidebar-open" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1">
		<rect x="1" y="1" width="12" height="12" rx="1"></rect>
		<line x1="8" y1="1" x2="8" y2="13"></line>
		<rect x="8" y="1" width="5" height="12" fill="currentColor" stroke="none"></rect>
	</symbol>
	<symbol id="icon-sidebar-closed" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1">
		<rect x="1" y="1" width="12" height="12" rx="1"></rect>
		<line x1="8" y1="1" x2="8" y2="13"></line>
		<rect x="8" y="1" width="5" height="12" fill="none" stroke="none"></rect>
	</symbol>
	<symbol id="icon-attach" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
		<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
	</symbol>
	<symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
		<path d="M12 19V5M5 12l7-7 7 7"></path>
	</symbol>
	<symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
		<path d="M6 9l6 6 6-6"></path>
	</symbol>
	<symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
		<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
		<circle cx="12" cy="12" r="3"></circle>
	</symbol>
</svg>
<script src="modules/boot.js"></script>

<main class="flex items-go-y">
	<header class="flex items-go-x">
		<div class="branding , flex items-go-x">
			<div class="logo , items-near-center">
				<img alt="快连AI Logo" src="../logo.svg" width="24" height="28">
			</div>
			<span class="brand">快连AI</span>
			<span class="version">v5.4.2</span>
		</div>
		<div class="workspace , flex items-go-x">
			<span>当前存储目录：</span>
			<span class="tip">未选择目录</span>
			<button class="change-dir btn" title="更换目录">
				<svg class="icon"><use href="#icon-folder"></use></svg>
			</button>
			<button class="delete-dir btn , danger" title="弃用目录">
				<span style="font-size:16px;font-weight:700">×</span>
			</button>
			<button class="wipe-dir btn , danger" title="清空数据">
				<svg class="icon"><use href="#icon-trash"></use></svg>
			</button>
		</div>
		<nav class="flex items-go-x">
			<button class="toggle-sidebar , btn" title="显示/隐藏右侧栏">
				<svg class="icon"><use href="#icon-sidebar-open"></use></svg>
			</button>
			<button class="help btn" title="帮助">?</button>
			<a class="github btn" href="https://github.com/magical-l/kuai-lian-ai" target="_blank" title="@GitHub">
				<img alt="GitHub" class="icon" src="https://github.githubassets.com/favicons/favicon.svg">
			</a>
			<a class="gitee btn" href="https://gitee.com/magicall/kuai-lian-ai" target="_blank" title="@Gitee">
				<img alt="Gitee" class="icon" src="https://gitee.com/favicon.ico">
			</a>
		</nav>
	</header>
	<div class="main-row , flex items-go-x">
		<aside class="endpoint list , flex items-go-y">
			<header class="flex items-go-x">
				<span>AI服务端点</span>
				<span class="flex items-go-x" style="gap:4px">
					<button class="btn-icon test-all" title="测试全部连接"></button>
					<button class="btn-icon collapse-all" title="收起全部"></button>
					<button class="add-group" title="新增端点">
						<span style="font-size:16px;font-weight:700">+</span>
					</button>
				</span>
			</header>
		</aside>
		<div class="divider col left"></div>
		<section class="main-content , flex items-go-y">
			<header class="toolbar , flex items-go-x">
				<span>会话：</span>
				<span class="title">新会话</span>
				<div class="btn-group : jump , flex items-go-x">
					<button class="go-top btn" title="到顶部">↑</button>
					<button class="go-bottom btn" title="到底部">↓</button>
				</div>
				<button class="new-session btn" title="新建会话">新建会话</button>
			</header>
			<section id="chat-messages" class="flex items-go-y"></section>

			<footer class="chat-input-area , flex items-go-y">
				<div class="divider row"></div>
				<div class="selected endpoint list , flex items-go-x">
					<!-- 已选模型标签 -->
				</div>
				<textarea id="chat-input" placeholder="输入消息..." rows="3"></textarea>
				<menu class="flex items-go-x items-near-center" style="padding:8px;min-height:40px">
					<div class="attachment list , flex items-go-x flexible scrollable" style="gap:4px"></div>
					<input type="file" class="file-input" multiple accept="*/*">
					<button class="add attachment btn , flex items-go-x" title="添加附件">
						<svg width="16" height="16"><use href="#icon-attach"></use></svg>
					</button>
					<div class="mode-selector , flex items-go-x" role="radiogroup">
						<span class="mode-option selected" data-mode="chat">💬 聊天</span>
						<span class="mode-option" data-mode="embedding">🔢 嵌入</span>
					</div>
					<div class="send-btn-group split-btn" title="发送">
						<button class="send split-btn-main primary , flex items-go-x">
							<svg width="16" height="16"><use href="#icon-send"></use></svg>
						</button>
						<button class="send-mode-toggle split-btn-drop , flex items-go-x">
							<svg width="12" height="12"><use href="#icon-chevron-down"></use></svg>
						</button>
						<div class="split-btn-menu">
							<div class="split-btn-option selected" data-value="enter">Enter 发送</div>
							<div class="split-btn-option" data-value="ctrl-enter">Ctrl+Enter 发送</div>
						</div>
					</div>
					<button class="stop btn hidden" disabled>停止</button>
				</menu>
			</footer>
		</section>
		<div class="divider col right"></div>
		<aside class="session list , flex items-go-y">
			<header class="flex items-go-x">
				<span>会话记录</span>
			</header>
		</aside>
	</div>
</main>
<!-- ========== Templates ========== -->
<template id="edit-group-dialog">
	<dialog class="editing">
		<h3></h3>
		<form class="flex items-go-y">
			<label class="flex items-go-y">名称: <input class="group-name"></label>
			<label class="flex items-go-y">Base URL（选填）:
				<input class="group-url" placeholder="https://api.example.com">
				<span class="inherit-hint"></span>
				<div class="hint-text">若路径以 # 结尾，则直接使用该路径</div>
			</label>
			<label class="flex items-go-y">接口风格:
				<select class="group-style">
					<option value="">（继承）</option>
					<option value="openai">OpenAI</option>
					<option value="claude">Claude</option>
					<option value="gemini">Gemini</option>
				</select>
			</label>
			<label class="flex items-go-y">API Key（选填）:
				<div class="key-input-wrapper , flex items-go-x">
					<input class="group-key" type="password" placeholder="">
					<button type="button" class="toggle-key" title="显示/隐藏">
						<svg width="14" height="14"><use href="#icon-eye"></use></svg>
					</button>
				</div>
				<span class="inherit-hint"></span>
			</label>
			<label class="flex items-go-y">模型名（选填）:
				<input class="group-modelid" placeholder="如 gpt-4o">
				<span class="inherit-hint"></span>
			</label>
			<label class="flex items-go-y">备注（选填）:
				<input class="group-remark" placeholder="仅用于显示">
			</label>
		</form>
		<div class="footer-hint">若 baseUrl、接口风格、API Key、模型名都存在（含继承），则该节点可作为端点使用</div>
		<footer class="action-buttons , flex items-go-x">
			<button class="cancel">✗</button>
			<button class="save primary">✓</button>
		</footer>
	</dialog>
</template>
<template id="user-header">
	<header class="request info , flex items-go-x">
		<span class="name">我</span>
		<span class="time"></span>
		<button class="icon copy-btn" title="复制">
			<span class="copy-icon">⧉</span><span class="copy-check">✓</span>
		</button>
	</header>
</template>
<template id="response-header">
	<header class="response info , flex items-go-x">
		<span class="name"></span>
		<span class="time"></span>
		<button class="icon copy-btn" title="复制">
			<span class="copy-icon">⧉</span><span class="copy-check">✓</span>
		</button>
	</header>
</template>
<template id="multi-response-header">
	<header class="response info , flex items-go-x">
		<span class="name"></span>
		<span class="time"></span>
		<span class="wait time"></span>
		<span class="total time"></span>
		<span class="status"></span>
		<span class="error"></span>
		<button class="icon copy-btn" title="复制">
			<span class="copy-icon">⧉</span>
			<span class="copy-check">✓</span>
		</button>
	</header>
</template>
<template id="response-card-streaming">
	<article class="card thinking response">
		<header class="response info , flex items-go-x">
			<span class="name"></span>
			<span class="icon model status-icon spinning">◐</span>
		</header>
		<div class="think stream , hidden">
			<header class="btn , flex items-go-x">
				<span class="icon"></span>
				<span class="label">思考</span>
				<span class="duration"></span>
			</header>
			<div class="content">等待思考...</div>
		</div>
		<div class="content">等待回复...</div>
	</article>
</template>
<template id="help-dialog">
	<dialog class="help">
		<h3>快<del>恋爱</del>连AI 使用帮助</h3>
		<article>
			<section>
				快连AI是一款极致小巧的小工具，主要用于快速添加和管理大模型服务端点、快速测试连接、简单对话。端点信息、会话记录完全存于你电脑本地，不会翻本地文件（由浏览器严格把关），也不会联网泄漏。
			</section>
			<section>
				<h4>选目录</h4>
				<p>首次打开页面需选择一个本地文件夹做工作目录，端点信息、会话记录将保存于该目录，随时可换，可自己在操作系统里查看、备份。</p>
				<p>后续重新打开页面可能会需要重新确认一下该目录（浏览器干的）。</p>
			</section>
			<section class="workspace directory">
				<h4>存储目录</h4>
				<div class="info , flex items-go-x">
					<span class="name"></span>
					<div class="actions , flex items-go-x">
						<button class="recover">恢复目录</button>
						<button class="select-dir"></button>
						<button class="use-browser-storage">使用浏览器存储</button>
					</div>
				</div>
				<p class="warning">请选择存储模式：选择本地目录，或使用浏览器内置存储（无需选目录）</p>
				<p class="storage-hint">浏览器存储：数据保存在浏览器内部（chrome.storage/IndexedDB），无需选择文件夹，随浏览器自动持久化。</p>
			</section>
			<section>
				<h4>左侧栏：管理端点</h4>
				<p>端点是线上部署的大模型服务。不同端点有不同地址，同一模型可部署在多个地址，成为不同端点。一个端点可以提供多个模型。</p>
				<p>* 目前支持OpenAI、Claude、Gemini三种接口格式。国产大模型基本都是OpenAI格式。</p>
				<p>* 不支持的格式快来贡献代码呀！</p>
				<p>可以测试连接模型，也可以测试一个端点下添加的所有模型。</p>
				<p>* 有些服务端点没开CORS，浏览器访问会被拒。我们区分了这种情况，免得以为是服务挂了。</p>
			</section>
			<section>
				<h4>中间：聊天</h4>
				<p>可以选择一个或多个模型舌战群儒。</p>
				<p>交谈中可以随时加入未选模型，或移除已选模型（踢出群！）。</p>
				<p>* 目前多轮对话只会把你的话和该模型之前的回复作为上下文，不搭理其他模型。</p>
			</section>
			<section>
				<h4>右侧栏：会话记录</h4>
				<p>可收起，眼不见为净。点击旧会话可再续前缘。</p>
			</section>
		</article>
		<footer class="action-buttons">
			<button class="close primary">✓</button>
		</footer>
	</dialog>
</template>

	<script src="../vendor/marked.min.js"></script>
	<script src="../vendor/highlight.min.js"></script>
	<!-- app-modules -->
	<script src="modules/storage-core.js"></script>
	<script src="modules/providers.js"></script>
	<script src="modules/ui-utils.js"></script>
	<script src="modules/model-selector.js"></script>
	<script src="modules/attachments.js"></script>
	<script src="modules/store.js"></script>
	<script src="modules/api.js"></script>
	<script src="modules/shared.js"></script>
	<script src="modules/main.js"></script>
	<!-- /app-modules -->
</div>

</body></html>
