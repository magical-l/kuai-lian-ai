<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快连AI</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../vendor/highlight-github.min.css">
<link href="https://css.lwj621.workers.dev/css/common.css" rel="stylesheet">
<link href="https://css.lwj621.workers.dev/css/layout.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<script src="modules/boot.js"></script>

<main class="flex items-go-y">
	<header class="flex items-go-x">
		<div class="branding , flex items-go-x">
			<div class="logo , items-near-center">
				<img alt="快连AI Logo" src="../logo.svg" width="24" height="28">
			</div>
			<span class="brand">快<del>恋爱</del>连AI</span>
			<span class="version">v6.6.4</span>
		</div>
		<div class="workspace-setting , flex items-go-x">
			<span class="label">当前存储目录：</span>
			<span class="cur">未选择目录</span>
			<div class="btn-group actions , flex items-go-x">
				<button class="change-dir btn , bare icon-only , square" title="更换目录">
					<svg class="icon"><use href="icons.svg#icon-folder"></use></svg>
				</button>
				<button class="delete-dir btn , danger bare icon-only , square" title="弃用目录">
					<span style="font-size:16px;font-weight:700">×</span>
				</button>
				<button class="wipe-dir btn , danger bare icon-only , square" title="清空数据">
					<svg class="icon"><use href="icons.svg#icon-trash"></use></svg>
				</button>
			</div>
		</div>
		<nav class="flex items-go-x">
			<button class="toggle-sidebar btn , bare icon-only , square" title="显示/隐藏右侧栏">
				<svg class="icon"><use href="icons.svg#icon-sidebar-open"></use></svg>
			</button>
			<button class="help btn , bare icon-only , square" title="帮助">?</button>
			<button class="theme btn , bare icon-only , square" popovertarget="themePop" title="切换主题">
				<svg class="icon"><use href="icons.svg#icon-sun"></use></svg>
				</button>
			<a class="github btn , bare icon-only , square" href="https://github.com/magical-l/kuai-lian-ai" target="_blank" title="@GitHub">
				<img alt="GitHub" class="icon" src="https://github.githubassets.com/favicons/favicon.svg">
			</a>
			<a class="gitee btn , bare icon-only , square" href="https://gitee.com/magicall/kuai-lian-ai" target="_blank" title="@Gitee">
				<img alt="Gitee" class="icon" src="https://gitee.com/favicon.ico">
			</a>
		</nav>
		<template id="help-dialog">
			<dialog class="help">
				<header>
					<h3>快<del>恋爱</del>连AI 使用帮助</h3>
					<button class="close btn , bare icon-only , square">✗</button>
				</header>
				<article> 
					<section>
						快连AI是一款极致小巧的小工具，主要用于快速添加和管理大模型服务端点、快速测试连接、简单对话。端点信息、会话记录完全存于你电脑本地，不会翻本地文件（由浏览器严格把关），也不会联网泄漏。
					</section>
					<section>
						<h4>选目录</h4>
						<p>首次打开页面需选择一个本地文件夹做工作目录，端点信息、会话记录将保存于该目录，随时可换，可自己在操作系统里查看、备份。</p>
						<p>后续重新打开页面可能会需要重新确认一下该目录（浏览器干的）。</p>
					</section>
					<section class="workspace-setting">
						<h4>存储目录</h4>
						<div class="field , flex items-go-x">
							<span class="cur"></span>
							<div class="actions , flex items-go-x">
								<button class="recover btn primary">恢复目录</button>
								<button class="select-dir btn"></button>
								<button class="use-browser-storage btn">使用浏览器存储</button>
							</div>
						</div>
						<p class="warning">请选择存储模式：选择本地目录，或使用浏览器内置存储（无需选目录）</p>
						<p class="storage-hint">浏览器存储：数据保存在浏览器内部（chrome.storage/IndexedDB），无需选择文件夹，随浏览器自动持久化。</p>
					</section>
					<section>
						<h4>左侧栏：管理端点</h4>
						<p>端点是线上部署的大模型服务。不同端点有不同地址，同一模型可部署在多个地址，成为不同端点。一个端点可以提供多个模型。</p>
						<p>* 目前支持ChatGPT/OpenAI式、Claude/Anthropic式、Gemini/Google式三种接口格式。国产大模型基本都是ChatGPT/OpenAI格式。</p>
						<p>* 不支持的格式快来贡献代码呀！</p>
						<p>可以测试连接端点，也可以测试一个端点下添加的所有模型。</p>
						<p>* 有些服务端点没开CORS，浏览器访问会被拒。我们区分了这种情况，免得以为是服务挂了。</p>
					</section>
					<section>
						<h4>中间：聊天</h4>
						<p>可以选择一个或多个端点舌战群儒。</p>
						<p>交谈中可以随时加入未选端点，或移除已选端点（踢出群！）。</p>
						<p>* 目前多轮对话只会把你的话和该模型之前的回复作为上下文，不搭理其他模型。</p>
					</section>
					<section>
						<h4>右侧栏：会话记录</h4>
						<p>可收起，眼不见为净。点击旧会话可再续前缘。</p>
					</section>
				</article>
			</dialog>
		</template>

		<div id="themePop" popover="" role="menu">
			<label class="option btn , flex items-go-x">
				<input type="radio" name="theme" value="light" checked>
				<svg class="icon" style="width:16px;height:16px"><use href="icons.svg#icon-sun"></use></svg>
				亮色模式
			</label>
			<label class="option btn , flex items-go-x">
				<input type="radio" name="theme" value="dark">
				<svg class="icon" style="width:16px;height:16px"><use href="icons.svg#icon-moon"></use></svg>
				暗色模式
			</label>
			<label class="option btn , flex items-go-x">
				<input type="radio" name="theme" value="system">
				<svg class="icon" style="width:16px;height:16px"><use href="icons.svg#icon-auto"></use></svg>
				跟随系统
			</label>
		</div>
	</header>
	<div class="main-row , flex items-go-x">
		<aside class="endpoint list , flex items-go-y">
			<header class="flex items-go-x">
				<span>AI服务端点</span>
				<div style="display:flex;gap:2px;align-items:center">
					<div class="btn-group endpoint-type filter flex items-go-x">
						<label title="聊天" class="endpoint-type option btn : chat , icon-only square">
							<input type="checkbox" value="chat" checked hidden>
						</label>
						<label title="嵌入" class="endpoint-type option btn : embed , icon-only square">
							<input type="checkbox" value="embed" checked hidden>
						</label>
						<label title="生图" class="endpoint-type option btn : img-generate , icon-only square">
							<input type="checkbox" value="img-generate" checked hidden>
						</label>
						<label title="重排序" class="endpoint-type option btn : rerank , icon-only square">
							<input type="checkbox" value="rerank" checked hidden>
						</label>
					</div>
				</div>
				<span class="btn-group , flex items-go-x">
					<button class="test-all btn , bare icon-only , square" title="测试全部连接">🔗</button>
					<button class="collapse-all btn , bare icon-only , square" title="收起全部">
						<svg width="14" height="14" viewBox="0 0 24 24"><use href="icons.svg#icon-collapse-all"></use></svg>
					</button>
					<button class="add-group btn , bare icon-only , square" title="新增端点">
						<span style="font-size:16px;font-weight:700">+</span>
					</button>
				</span>
			</header>
			<ol class="scrollable on-y when-content-long">
				<template id="one-endpoint">
					<li class="one endpoint">
						<details>
							<summary>
								<header class="inline flex items-x-mutex items-y-near-center">
									<span class="handle drag btn , bare icon-only , square" draggable="true" title="拖动排序">⋮⋮</span>
									<span class="endpoint-type badge icon icon-only"></span>
									<span class="name"></span>
									<div class="btn-group actions , flex items-go-x">
										<button class="add-child btn , bare icon-only , square" title="添加子节点">+</button>
										<button class="test-connection btn , bare icon-only , square" title="测试连接"><span>🔗</span></button>
										<label class="join-session btn , bare icon-only , square" title="加入当前会话">
											<input type="checkbox" hidden>
											<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><use href="icons.svg#icon-bubble"></use></svg>
										</label>
										<button class="edit btn , bare icon-only , square" title="编辑节点">✎</button>
										<button class="remove btn , danger bare icon-only , square" title="删除节点及其子节点">
											<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="icons.svg#icon-trash"></use></svg>
										</button>
									</div>
								</header>
							</summary>
						</details>
					</li>
				</template>
			</ol>
			<div class="empty-state hidden">
				<span class="empty-hint"></span>
				<button class="reset-filter btn , hidden">重置筛选</button>
				<button class="add-endpoint btn , hidden">去创建</button>
			</div>
			<template id="edit-group-dialog">
				<dialog class="editing endpoint">
					<header><h3></h3></header>
					<form class="editor-form">
	<label class="full flex items-go-x items-y-near-center">
		<span class="label-text">名称:</span>
		<span class="input-block"><input name="name"></span>
	</label>
	<label class="full flex items-go-x items-y-near-center">
		<span class="label-text">Base URL（选填）:</span>
		<span class="input-block">
			<input name="url" placeholder="https://api.example.com">
			<span class="hint">若路径以 # 结尾，则直接使用该路径</span>
		</span>
	</label>
	<label class="full flex items-go-x items-y-near-center">
		<span class="label-text">接口风格:</span>
		<span class="input-block">
			<div class="btn-group , flex items-go-x">
				<label class="option btn"><input type="radio" name="style" value="" hidden> 继承</label>
				<label class="option btn"><input type="radio" name="style" value="openai" hidden> ChatGPT式 <span class="hint">OpenAI、国内主流</span></label>
				<label class="option btn"><input type="radio" name="style" value="claude" hidden> Claude式 <span class="hint">Anthropic</span></label>
				<label class="option btn"><input type="radio" name="style" value="gemini" hidden> Gemini式 <span class="hint">Google</span></label>
			</div>
		</span>
	</label>
	<label class="full flex items-go-x items-y-near-center">
		<span class="label-text">类型:</span>
		<span class="input-block">
			<div class="btn-group , flex items-go-x">
				<label class="option btn"><input type="radio" name="type" value="" hidden> 继承</label>
				<label class="option btn"><input type="radio" name="type" value="chat" hidden> 💬 聊天</label>
				<label class="option btn"><input type="radio" name="type" value="embed" hidden> 🔢 嵌入</label>
				<label class="option btn"><input type="radio" name="type" value="img-generate" hidden> 🎨 生图</label>
				<label class="option btn"><input type="radio" name="type" value="rerank" hidden> 📊 重排序</label>
			</div>
			<span class="hint"></span>
		</span>
	</label>
	<label class="full flex items-go-x items-y-near-center">
		<span class="label-text">API Key（选填）:</span>
		<span class="input-block">
			<span class="flex items-go-x" style="align-items:center;gap:var(--space-1)">
				<input name="apikey" type="password">
				<button type="button" class="toggle apikey visibility btn , square icon-only" title="显示/隐藏">
					<svg><use href="icons.svg#icon-eye"></use></svg>
				</button>
			</span>
		</span>
	</label>
	<label class="full flex items-go-x items-y-near-center">
		<span class="label-text">模型名（选填）:</span>
		<span class="input-block"><input name="model-id" placeholder="如 gpt-4o"></span>
	</label>
	<label class="full flex items-go-x items-y-near-center">
		<span class="label-text">备注（选填）:</span>
		<span class="input-block"><input name="remark" placeholder="仅用于显示"></span>
	</label>
	<div class="footer-hint">若 baseUrl、接口风格、API Key、模型名都存在（含继承），则该节点可作为端点使用</div>
</form>
					<footer class="flex items-go-x">
						<button class="cancel btn">✗</button>
						<button class="save btn primary">✓</button>
					</footer>
				</dialog>
			</template>
		</aside>
		<div class="divider col left"></div>
		<section class="main-content , flex items-go-y">
			<header class="toolbar , flex items-go-x">
				<span>会话：</span>
				<span class="title">新会话</span>
				<div class="btn-group : jump , flex items-go-x">
					<button class="go-top btn square" title="到顶部">↑</button>
					<button class="go-bottom btn square" title="到底部">↓</button>
				</div>
				<button class="new-session btn" title="新建会话">新建会话</button>
			</header>
			<section class="msg list flex items-go-y">
			</section>
			<template id="user-header">
				<header class="flex items-go-x">
					<span class="name">我</span>
					<span class="time"></span>
					<button class="copy content btn , bare icon-only , square" title="复制">
						<span class="copy icon ⧉">⧉</span><span class="done icon">✓</span>
					</button>
				</header>
			</template>
			<template id="response-header">
				<header class="flex items-go-x">
					<span class="name"></span>
					<span class="time"></span>
					<span class="wait time"></span>
					<span class="total time"></span>
					<span class="status"></span>
					<button class="copy content btn , bare icon-only , square" title="复制">
						<span class="copy icon ⧉">⧉</span>
						<span class="done icon">✓</span>
					</button>
				</header>
			</template>
			<template id="response-card-streaming">
				<article class="one response msg">
					<header class="flex items-go-x">
						<span class="name"></span>
						<span class="icon status-icon spin">◐</span>
						<button class="stop-one btn , square icon-only bare danger" title="停止"></button>
					</header>
					<div class="content">
						<details class="think hidden" open>
							<summary>
								<div class="inline flex items-go-x items-y-near-center">
									<span class="label">思考</span>
									<span class="duration"></span>
								</div>
							</summary>
							<div class="text">等待思考...</div>
						</details>
						<div class="say">等待回复...</div>
					</div>
				</article>
			</template>

			<footer class="chat-input-area , flex items-go-y">
				<div class="divider row"></div>
				<ul class="selected endpoint list , flex items-go-x">
					<!-- 已选端点标签 -->
				</ul>
				<textarea id="chat-input" placeholder="输入消息..." rows="3"></textarea>
				<menu class="flex items-go-x items-near-center" style="padding:8px;min-height:40px">
					<div class="attachment list , flex items-go-x flexible scrollable" style="gap:4px"></div>
					<input type="file" class="file-input" multiple accept="*/*">
					<button class="add attachment btn , square icon-only" title="添加附件">
						<svg><use href="icons.svg#icon-attach"></use></svg>
					</button>
					
					<div class="split btn-group : send , flex items-go-x items-from-left" title="发送">
						<button class="main btn : send , primary , icon-only">
							<svg><use href="icons.svg#icon-send"></use></svg>
						</button>
						<button class="secondary btn : send-shotcut-selector , icon-only" popovertarget="sendModePop">
							<svg><use href="icons.svg#icon-chevron-down"></use></svg>
						</button>
						<div id="sendModePop" popover="auto">
							<div class="flex items-go-y">
								<label class="option btn">
									Enter 发送 <input type="radio" name="sendMode" value="enter" checked>
								</label>
								<label class="option btn">
									Ctrl+Enter 发送 <input type="radio" name="sendMode" value="ctrl-enter">
								</label>
							</div>
						</div>
					</div>
					<button class="stop btn square hidden" disabled aria-label="停止生成"><span class="stop-icon"></span></button>
				</menu>
			</footer>
		</section>
		<div class="divider col right"></div>
		<aside class="session list , flex items-go-y">
			<header class="flex items-go-x">
				<span>会话记录</span>
			</header>
			<ol class="scrollable on-y when-content-long">
				<template id="one-session">
					<li class="one session">
						<div class="session title">新会话</div>
						<div class="session meta , flex items-go-x">
							<span class="session time"></span>
							<div class="btn-group session actions , flex items-go-x">
								<button class="edit title btn , bare icon-only , square" title="编辑标题">✎</button>
								<button class="remove btn , danger bare icon-only , square" title="删除会话">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="icons.svg#icon-trash"></use></svg>
								</button>
							</div>
						</div>
					</li>
				</template>
			</ol>
		</aside>
	</div>
</main>

<div class="js container">
	<script src="../vendor/marked.min.js"></script>
	<script src="../vendor/highlight.min.js"></script>
	<!-- app-modules -->
	<script src="modules/storage-core.js"></script>
	<script src="modules/providers.js"></script>
	<script src="modules/ui-utils.js"></script>
	<script src="modules/selected-endpoints.js"></script>
	<script src="modules/endpoint-tree.js"></script>
	<script src="modules/messages.js"></script>
	<script src="modules/session-list.js"></script>
	<script src="modules/attachments.js"></script>
	<script src="modules/store.js"></script>
	<script src="modules/api.js"></script>
	<script src="modules/shared.js"></script>
	<script src="modules/main.js"></script>
	<!-- /app-modules -->
</div>
</body></html>
