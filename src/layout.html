	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>快连AI</title>
	<link rel="icon" href="恋-人脸、ai.svg" type="image/svg+xml">
	<link rel="stylesheet" href="vendor/highlight-github.min.css">
	<style>{CSS}</style>
	</head><body>{BOOT}


	<main class="layout-y-queue">
		<header class="layout-x-queue app-header">
			<div class="left layout-x-queue">
				<div class="logo layout-x-queue">
					<img src="恋-人脸、ai.svg" width="24" height="28" alt="快连AI Logo">
				</div>
				<span class="brand">快连AI</span><span class="version">v3.2.0</span>
			</div>
			<div class="center layout-x-queue">
				<span class="directory-label">当前存储目录：</span>
				<span id="directory-path" class="directory-path">未选择目录</span>
				<button id="btn-change-dir" class="navbar" title="更换目录">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
					</svg>
				</button>
				<button id="btn-delete-dir" class="navbar danger" title="弃用目录">
					<span style="font-size:16px;font-weight:700">×</span>
				</button>
				<button id="btn-wipe-dir" class="navbar danger" title="清空数据">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M3 6h18"></path>
						<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
						<path d="M12 6v16"></path>
					</svg>
				</button>
			</div>
			<div class="right layout-x-queue">
				<button id="btn-toggle-sidebar" class="navbar" title="显示/隐藏右侧栏">
					<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1">
						<rect x="1" y="1" width="12" height="12" rx="1"></rect>
						<line x1="8" y1="1" x2="8" y2="13"></line>
						<rect id="sidebar-toggle-right-panel" x="8" y="1" width="5" height="12" fill="currentColor" stroke="none"></rect>
					</svg>
				</button>
				<button id="btn-help" class="navbar help" title="帮助">?</button>
					<a class="navbar" href="https://github.com/magical-l/kuai-lian-ai" target="_blank" title="GitHub 仓库">
						<img src="
https://github.githubassets.com/favicons/favicon.svg" width="14" height="14" alt="GitHub">
					</a>
					<a class="navbar" href="https://gitee.com/magicall/kuai-lian-ai" target="_blank" title="Gitee 仓库">
						<img src="https://gitee.com/favicon.ico" width="14" height="14" alt="Gitee">
					</a>
			</div>
		</header>
		<div id="main-row" class="layout-x-queue">
			<aside class="left layout-y-queue">
				<header class="layout-x-queue">
					<span>AI服务端点</span>
					<button id="btn-add-group" title="新增端点">
						<span style="font-size:16px;font-weight:700">+</span>
					</button>
				</header>
				<div class="content" id="endpoint-list"></div>
			</aside>
			<div class="divider column control sidebar left"></div>
			<div id="main-content" class="layout-y-queue">
				<div id="chat-header" class="layout-x-queue">
					<span class="prefix">会话：</span>
					<span id="chat-title">新会话</span>
					<div id="scroll-nav-buttons" class="layout-x-queue">
						<button id="btn-scroll-top" class="scroll-btn" title="到顶部">↑</button>
						<button id="btn-scroll-bottom" class="scroll-btn" title="到底部">↓</button>
					</div>
					<button id="btn-new-session-header" class="outline" title="新建会话">新建会话</button>
				</div>
				<div id="chat-messages" class="layout-y-queue"></div>
				<div class="sticky-bottom">
					<div class="divider row"></div>
					<div class="chat-input-area layout-y-queue">
						<div id="model-selector" class="model selector collapsed">
							<div class="selector header layout-x-queue">
								<div class="selector summary layout-x-queue" id="selector-summary">
									<!-- 收起时显示已选模型标签 -->
								</div>
								<div class="selector expand-btn" id="selector-expand-btn">
									<span id="expand-btn-text">▼ 展开</span>
								</div>
							</div>
							<div class="selector list" id="selector-list">
								<!-- 展开时显示按端点分组的模型列表 -->
							</div>
						</div>
						<div class="input-wrapper layout-y-queue">
							<textarea id="chat-input" placeholder="输入消息..." rows="3"></textarea>
							<div id="action-bar" style="display:flex;align-items:center;gap:8px;padding:8px;min-height:40px;">
								<div id="attachments-row" style="display:flex;gap:4px;flex:1;overflow-x:auto;"></div>
								<input type="file" id="file-input" multiple accept="*/*">
								<button id="btn-attach" class="action-btn layout-x-queue" title="添加附件">
									<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
										<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
									</svg>
								</button>
								<div id="mode-selector" class="mode-selector layout-x-queue" role="radiogroup">
									<span class="mode-option selected" data-mode="chat">💬 聊天</span>
									<span class="mode-option" data-mode="embedding">🔢 嵌入</span>
								</div>
								<div id="send-btn-group" class="split-btn" title="发送">
									<button id="btn-send" class="split-btn-main primary layout-x-queue">
										<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
											<path d="M12 19V5M5 12l7-7 7 7"></path>
										</svg>
									</button>
									<button id="send-mode-toggle" class="split-btn-drop layout-x-queue">
										<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
											<path d="M6 9l6 6 6-6"></path>
										</svg>
									</button>
									<div id="send-mode-menu" class="split-btn-menu">
										<div class="split-btn-option selected" data-value="enter">Enter 发送</div>
										<div class="split-btn-option" data-value="ctrl-enter">Ctrl+Enter 发送</div>
									</div>
								</div>
							</div>
						</div>
						<button id="btn-stop" style="display:none;" disabled>停止</button>
					</div>
				</div>
			</div>
			<div class="divider column control sidebar right"></div>
			<aside class="right layout-y-queue">
				<header class="layout-x-queue">
					<span>会话记录</span>
				</header>
				<div class="content" id="session-list"></div>
			</aside>
		</div>
	</main>
	<!-- ========== Templates ========== -->
	<template id="tpl-edit-group-dialog">
		<div id="edit-dialog">
			<h3></h3>
			<form class="dialog-form layout-y-queue">
				<label class="layout-y-queue">名称: <input id="dialog-group-name"></label>
				<label class="layout-y-queue">Base URL: <input id="dialog-group-url"></label>
				<label class="layout-y-queue">接口风格:
					<select id="dialog-group-style">
						<option value="openai">OpenAI</option>
						<option value="claude">Claude</option>
						<option value="gemini">Gemini</option>
					</select>
				</label>
				<label class="layout-y-queue">API Key: <div class="key-input-wrapper layout-x-queue"><input id="dialog-group-key" type="password"><button class="toggle-key" title="显示/隐藏"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
								<circle cx="12" cy="12" r="3"></circle>
							</svg></button></div></label>
			</form>
			<footer class="dialog-buttons layout-x-queue">
				<button id="dialog-cancel">✗</button>
				<button id="dialog-save" class="primary">✓</button>
			</footer>
		</div>
	</template>
	<template id="tpl-add-model-inline">
		<div class="add-model-inline layout-x-queue">
			<input type="text" placeholder="模型名" class="add-model-input">
			<button class="add-model-confirm action-sm">✓</button>
			<button class="add-model-cancel action-sm">✗</button>
		</div>
	</template>
	<template id="tpl-user-meta">
		<div class="request meta layout-x-queue">
			<span class="request name">我</span>
			<span class="request time"></span>
			<button class="icon copy-btn" title="复制">
				<span class="copy-icon">⧉</span><span class="copy-check">✓</span>
			</button>
		</div>
	</template>
	<template id="tpl-response-meta">
		<div class="response meta layout-x-queue">
			<span class="response model-name"></span>
			<span class="response time"></span>
			<button class="icon copy-btn" title="复制">
				<span class="copy-icon">⧉</span><span class="copy-check">✓</span>
			</button>
		</div>
	</template>
	<template id="tpl-multi-response-meta">
		<div class="response meta layout-x-queue">
			<span class="response model-name"></span>
			<span class="response time"></span>
			<span class="response duration"></span>
			<span class="response total"></span>
			<span class="response status"></span>
			<span class="response error"></span>
			<button class="icon copy-btn" title="复制">
				<span class="copy-icon">⧉</span><span class="copy-check">✓</span>
			</button>
		</div>
	</template>
	<template id="tpl-response-card-streaming">
		<div class="response card thinking">
			<div class="response meta layout-x-queue">
				<span class="response model-name"></span>
				<span class="model status-icon spinning">◐</span>
			</div>
			<div class="thinking-block streaming" style="display:none;">
				<div class="thinking-content">等待思考...</div>
			</div>
			<div class="response card-content">等待回复...</div>
		</div>
	</template>
	<template id="tpl-thinking-header">
		<div class="thinking-header layout-x-queue">
			<span class="thinking-icon"></span>
			<span class="thinking-label">思考</span>
			<span class="thinking-duration"></span>
		</div>
	</template>
	<template id="tpl-multi-response-hint">
		<div class="multi-response-hint">
			<span class="hint-text"></span>
			<button class="stop" id="btn-stop-inline">全部停止</button>
		</div>
	</template>
	<template id="tpl-help-dialog">
		<div id="help-dialog">
			<h3>快<span class="shhhh">恋爱</span>连AI 使用帮助</h3>
			<div class="help-content">
				<div class="help-section">
					快连AI是一款极致小巧的小工具，主要用于快速添加和管理大模型服务端点、快速测试连接、简单对话。端点信息、会话记录完全存于你电脑本地，不会翻本地文件（由浏览器严格把关），也不会联网泄漏。
				</div>
				<div class="help-section">
					<h4>选目录</h4>
					<p>首次打开页面需选择一个本地文件夹做工作目录，端点信息、会话记录将保存于该目录，随时可换，可自己在操作系统里查看、备份。</p>
					<p>后续重新打开页面可能会需要重新确认一下该目录（浏览器干的）。</p>
				</div>
				<div class="help-section help-section-directory">
					<h4>存储目录</h4>
					<div class="directory-info layout-x-queue">
						<span id="help-dir-name"></span>
						<div class="directory-buttons layout-x-queue" id="help-directory-buttons">
							<button id="btn-restore-dir" class="btn-restore">恢复目录</button>
							<button id="btn-change-dir-help"></button>
							<button id="btn-use-browser-storage" class="btn-browser-storage">使用浏览器存储</button>
						</div>
					</div>
					<p class="directory-warning" id="help-directory-warning">请选择存储模式：选择本地目录，或使用浏览器内置存储（无需选目录）</p>
					<p class="browser-storage-hint">浏览器存储：数据保存在浏览器内部（chrome.storage/IndexedDB），无需选择文件夹，随浏览器自动持久化。</p>
				</div>
				<div class="help-section">
					<h4>左侧栏：管理端点</h4>
					<p>端点是线上部署的大模型服务。不同端点有不同地址，同一模型可部署在多个地址，成为不同端点。一个端点可以提供多个模型。</p>
					<p>* 目前支持OpenAI、Claude、Gemini三种接口格式。国产大模型基本都是OpenAI格式。</p>
					<p>* 不支持的格式快来贡献代码呀！</p>
					<p>可以测试连接模型，也可以测试一个端点下添加的所有模型。</p>
					<p>* 有些服务端点没开CORS，浏览器访问会被拒。我们区分了这种情况，免得以为是服务挂了。</p>
				</div>
				<div class="help-section">
					<h4>中间：聊天</h4>
					<p>可以选择一个或多个模型舌战群儒。</p>
					<p>交谈中可以随时加入未选模型，或移除已选模型（踢出群！）。</p>
					<p>* 目前多轮对话只会把你的话和该模型之前的回复作为上下文，不搭理其他模型。</p>
				</div>
				<div class="help-section">
					<h4>右侧栏：会话记录</h4>
					<p>可收起，眼不见为净。点击旧会话可再续前缘。</p>
				</div>
			</div>
			<footer class="dialog-buttons" id="help-dialog-buttons">
				<button id="help-close" class="primary">✓</button>
			</footer>
		</div>
		</template>
	<div class="js container">
		<script src="vendor/marked.min.js"></script>
		<script src="vendor/highlight.min.js"></script>
	</div>
	{APP}


</body></html>
